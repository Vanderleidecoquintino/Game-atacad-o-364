<!DOCTYPE html><html><head><meta charset='utf-8'><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATACADAO QUEST 364</title><style>body{background:#0a1931;color:#fff;font-family:Arial;text-align:center;padding:10px} .card{background:#FFD700;color:#000;padding:15px;border-radius:15px;margin:15px;font-weight:bold} button{background:#0055FF;color:#fff;padding:18px;border:none;border-radius:12px;font-size:18px;width:90%;margin-top:10px} input{width:90%;height:50px}</style></head><body><h2>🛒 ATACADAO QUEST 364</h2><p>De WHEY Pos 1 até TANG Pos 364</p><input type="range" min="0" max="364" value="0" oninput="u(this.value)"><h1 id="p">POSIÇÃO: 0 - ENTRADA</h1><div id="i" class="card">🚪 PORTA - Abaixo da 364</div><button onclick="alert('MISSÃO: Vá até 364 TANG End 449')">✅ ACEITAR MISSÃO</button><script>function u(v){let t="";if(v==0)t="🚪 ENTRADA - Abaixo da 364";else if(v==364)t="🏆 TANG B14 C125 End 449";else if(v==1)t="💪 WHEY B1 C100";else t="📍 Pos "+v+" - Faltam "+(364-v);document.getElementById('p').innerText="POSIÇÃO: "+v;document.getElementById('i').innerText=t;}</script></body></html>
