<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>364 FIX</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;text-align:center;padding:10px}
#box{width:95%;max-width:380px;height:400px;margin:10px auto;border:4px solid yellow;border-radius:15px;background:#1e3a8a;position:relative;overflow:hidden}
#player{position:absolute;font-size:30px;left:10px;top:10px;transition:0.3s}
#missao{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:85%;background:#0f172a;border:3px solid yellow;border-radius:12px;padding:12px;z-index:20}
button{width:90%;padding:14px;margin:5px;border:none;border-radius:10px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<h3>🛒 364 - V3.2</h3>
<div id="box">
<div id="player">🛒</div>
<div id="missao">
<b>📦 MISSÃO: TANG 364 → WHEY 1</b><br><br>
<button onclick="aceitar()" style="background:#22c55e;color:white">✅ ACEITAR MISSÃO</button>
</div>
</div>
<br>
<input type="range" id="slider" min="1" max="364" value="1" style="width:90%">
<h3 id="pos">POS: 364</h3>
<button onclick="gps()" style="background:#22c55e;color:white">📍 LIGAR GPS</button>
<p id="status">GPS desligado</p>
<script>
var pos=364;
var player=document.getElementById('player');
var slider=document.getElementById('slider');
var posTxt=document.getElementById('pos');
var statusTxt=document.getElementById('status');
function atualizar(v){
pos=v;
posTxt.innerText='POS: '+pos;
player.style.left=(v/4)+'%';
player.style.top=(v%100)+'px';
if(pos<=1){alert('CHEGOU NO WHEY!');}
}
slider.oninput=function(){
var invertido=365-parseInt(this.value);
atualizar(invertido);
}
function aceitar(){
document.getElementById('missao').style.display='none';
alert('Missão aceita! Use o slider agora');
}
function gps(){
statusTxt.innerText='GPS tentando ligar...';
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(function(p){
statusTxt.innerText='GPS OK '+p.coords.accuracy+'m';
},function(e){
statusTxt.innerText='GPS bloqueado - use slider';
});
}else{
statusTxt.innerText='Sem GPS nesse A1';
}
}
atualizar(364);
</script>
</body>
</html>
