<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATACADAO 364 - V54</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
#top{background:#facc15;color:#000;text-align:center;padding:8px;font-weight:bold}
canvas{width:100%;height:70vh;background:#020617;display:block;border:2px solid #facc15}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:6px}
button{height:50px;border-radius:12px;border:2px solid #facc15;background:#111;color:#facc15;font-size:18px;font-weight:bold}
select{height:50px;border-radius:12px;width:100%;grid-column:1/5;font-weight:bold}
#entrada{grid-column:1/5;background:#22c55e;color:#000}
</style>
</head>
<body>
<div id="top">ATACADAO 364 - V54 - BAIAS AZUIS</div>
<canvas id="c" width="520" height="760"></canvas>
<div class="btns">
<select id="combo"></select>
<button onclick="mover(-1,0)">←</button>
<button onclick="mover(0,-1)">↑</button>
<button onclick="mover(0,1)">↓</button>
<button onclick="mover(1,0)">→</button>
<button id="entrada" onclick="ir(6,18)">VOLTAR ENTRADA</button>
</div>
<script>
const COLS=13,ROWS=19;
let lab=[],px=6,py=18,tx=6,ty=18,cam=[],tm=null;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const PROD=[
{n:"TANG 364",x:2,y:2},{n:"ARROZ",x:4,y:2},{n:"FEIJAO",x:6,y:2},{n:"OLEO",x:8,y:2},{n:"BISCOITO",x:10,y:2},
{n:"REFRI",x:2,y:5},{n:"LIMPEZA",x:4,y:5},{n:"HIGIENE",x:6,y:5},{n:"FRIOS",x:8,y:5},{n:"PADARIA",x:10,y:5}
];
(function init(){
 let combo=document.getElementById('combo');
 PROD.forEach(p=>{let o=document.createElement('option');o.value=p.x+','+p.y;o.textContent=p.n;combo.appendChild(o);});
 for(let y=0;y<ROWS;y++){lab[y]=[];for(let x=0;x<COLS;x++){
   lab[y][x]=0;
   if(y!=0&&y!=18&&y!=9){if(x==1||x==3||x==5||x==7||x==9||x==11) if(y%2==1||y==2||y==5) lab[y][x]=1;}
 }}
 draw();
})();
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]==0;}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v=new Set([sx+','+sy]);while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v.has(k)&&livre(nx,ny)){v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]})}}}return [];}
function draw(){
 let W=cv.width/COLS,H=cv.height/ROWS;
 ctx.fillStyle='#020617';ctx.fillRect(0,0,cv.width,cv.height);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
   if(lab[y][x]==1){
     ctx.fillStyle='#0f2167';ctx.fillRect(x*W,y*H,W,H);
     ctx.fillStyle='#1e3a8a';ctx.fillRect(x*W+1,y*H+1,W-2,H-2);
     ctx.fillStyle='#3b82f6';ctx.fillRect(x*W+2,y*H+2,W-6,5);
   }
 }
 // destino vermelho
 if(!(tx==6&&ty==18)){ctx.fillStyle='red';ctx.fillRect(tx*W,ty*H,W,H);}
 // boneco amarelo
 ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(px*W+W/2,py*H+H/2,12,0,6.28);ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
}
function step(){if(cam.length==0){clearInterval(tm);tm=null;return;}let p=cam.shift();px=p.x;py=p.y;draw();}
function mover(dx,dy){let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;px=nx;py=ny;draw();}
function ir(x,y){if(tm)clearInterval(tm);tx=x;ty=y;cam=achar(px,py,x,y);if(cam.length==0){px=x;py=y;draw();return;}tm=setInterval(step,150);}
document.getElementById('combo').onchange=function(){let v=this.value.split(',');ir(parseInt(v[0]),parseInt(v[1]));}
</script>
</body>
</html>
