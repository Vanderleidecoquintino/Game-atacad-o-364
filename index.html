<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V54.4 - VOTO DISCRETO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#gps{background:#facc15;color:#000;padding:8px;text-align:center;font-size:11px;font-weight:bold;cursor:pointer}
#console{background:#111;color:#22c55e;padding:5px;font-family:monospace;font-size:9px;white-space:pre;line-height:11px;max-height:60px;overflow:auto;border-bottom:2px solid #facc15}
canvas{flex:1;width:100%;background:#000;border:3px solid #facc15;touch-action:none;display:block;min-height:400px}
.btns{display:grid;grid-template-columns:repeat(4,1fr) 1.5fr 1fr;gap:6px;padding:8px;background:#0a0a0a}
button{height:54px;border-radius:12px;border:2px solid #facc15;font-weight:bold}
.bm{background:#222;color:#facc15;font-size:20px}
.bway{background:#22c55e;color:#000;font-size:11px}
#combo{height:54px;border-radius:12px;border:2px solid #facc15;background:#fff;color:#000;font-weight:bold;font-size:14px;padding:0 8px;width:100%}
</style>
</head>
<body>
<div id="gps" onclick="GPS.iniciar()">📍 V54.4 - VOTO DISCRETO - 31 CAIXAS</div>
<div id="console"></div>
<canvas id="c"></canvas>
<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<select id="combo" onchange="trocarProduto()">
<option value="10,1">TANG 364</option>
<option value="2,2">ARROZ</option>
<option value="4,2">FEIJÃO</option>
<option value="6,2">ÓLEO</option>
<option value="8,2">BISCOITO</option>
<option value="2,5">REFRI</option>
<option value="4,5">LIMPEZA</option>
<option value="6,5">HIGIENE</option>
<option value="8,5">FRIOS</option>
<option value="2,10">PADARIA</option>
<option value="4,10">CARNES</option>
<option value="6,10">FRUTAS</option>
<option value="8,10">BEBIDAS</option>
<option value="10,10">RAÇÃO</option>
</select>
<button class="bway" onclick="ir(POS.WAY.x,POS.WAY.y)">ENTRADA</button>
</div>
<script>
const COLS=13,ROWS=19,W=40,H=26;
const POS={WAY:{x:12,y:15},ENTRADA:{x:12,y:15}};
let lab=[],dot=[],px=12,py=15,tx=12,ty=15,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0;
let produtoAtual="TANG 364";
let caixas=Array.from({length:31},(_,i)=>({id:i+1,fila:Math.floor(Math.random()*4)}));
let precos={"TANG 364":"R$ 1,49","ARROZ":"R$ 22,90","FEIJÃO":"R$ 8,99","ÓLEO":"R$ 7,49","BISCOITO":"R$ 3,99","REFRI":"R$ 8,99","LIMPEZA":"R$ 12,90","HIGIENE":"R$ 15,90","FRIOS":"R$ 29,90","PADARIA":"R$ 6,90","CARNES":"R$ 39,90","FRUTAS":"R$ 9,90","BEBIDAS":"R$ 4,99","RAÇÃO":"R$ 89,90"};
let icons={"TANG 364":"🧃","ARROZ":"🍚","FEIJÃO":"🫘","ÓLEO":"🫒","BISCOITO":"🍪","REFRI":"🥤","LIMPEZA":"🧹","HIGIENE":"🧴","FRIOS":"🧀","PADARIA":"🍞","CARNES":"🥩","FRUTAS":"🍎","BEBIDAS":"🍺","RAÇÃO":"🐶"};
// VOTOS - SALVA NO CELULAR
let votos=JSON.parse(localStorage.getItem('v54_votos')||'{}');
function getMedia(prod){let v=votos[prod];if(!v||v.q==0) return {media:0,q:0}; return {media:(v.s/v.q).toFixed(1),q:v.q};}
function votar(prod,nota){if(!votos[prod]) votos[prod]={s:0,q:0};votos[prod].s+=nota;votos[prod].q++;localStorage.setItem('v54_votos',JSON.stringify(votos));}
let caixaAtual=null,flagRect=null; // pra clicar nas estrelas
function pegaCaixaLivre(){caixas.sort((a,b)=>a.fila-b.fila);let c=caixas[0];c.fila++;setTimeout(()=>{c.fila=Math.max(0,c.fila-1)},20000);return c;}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const tangImg=new Image();tangImg.src='IMG-20260926-WA7510.jpg';
const GPS={ativo:false,iniciar(){if(!navigator.geolocation){document.getElementById('gps').innerText='GPS NÃO SUPORTADO';return;}document.getElementById('gps').innerText='🔍 BUSCANDO GPS...';navigator.geolocation.watchPosition(p=>{this.ativo=true;document.getElementById('gps').style.background='#22c55e';document.getElementById('gps').innerText=`🟢 V54.4 VOTO | ${produtoAtual}`;},e=>{document.getElementById('gps').style.background='#ef4444';document.getElementById('gps').innerText=`🔴 GPS ERRO: ${e.message}`},{enableHighAccuracy:true});}};
function trocarProduto(){let sel=document.getElementById('combo');let v=sel.value.split(',');produtoAtual=sel.options[sel.selectedIndex].text;ir(parseInt(v[0]),parseInt(v[1]));}
function init(){for(let y=0;y<ROWS;y++){lab[y]=[];dot[y]=[];for(let x=0;x<COLS;x++){if(y==0||y==8||y==17||x==0||x==12) lab[y][x]=0; else if(x%2==1) lab[y][x]=1; else lab[y][x]=0; dot[y][x]=lab[y][x]==0;}}let s=localStorage.getItem('v54_pos'); if(s){try{let p=JSON.parse(s);px=p.px;py=p.py;}catch(e){}}}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v=new Set([sx+','+sy]);while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v.has(k)&&livre(nx,ny)){v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]})}}}return []}
function resize(){let rect=cv.getBoundingClientRect();vw=rect.width||window.innerWidth;vh=rect.height||400;if(vh<300) vh=400;let dpr=window.devicePixelRatio||1;cv.width=vw*dpr;cv.height=vh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',()=>{resize();draw();});
function updateCam(){let tX=px*W - vw/2 + W/2, tY=py*H - vh/2 + H/2; camX+=(tX-camX)*0.15; camY+=(tY-camY)*0.15;let maxX=Math.max(0,COLS*W-vw);let maxY=Math.max(0,ROWS*H-vh);camX=Math.max(0,Math.min(camX,maxX));camY=Math.max(0,Math.min(camY,maxY));}
function draw(){
  updateCam(); ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh); ctx.save();ctx.translate(-camX,-camY);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(lab[y][x]==1){ctx.fillStyle='#0a194e';ctx.fillRect(x*W,y*H,W,H);ctx.fillStyle='#1e40af';ctx.fillRect(x*W+1,y*H+1,W-2,H-2);ctx.fillStyle='#93c5fd';ctx.font='bold 10px Arial';ctx.fillText('B'+(x+1),x*W+4,y*H+15);}
    else if(dot[y][x]){ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(x*W+20,y*H+13,2.5,0,6.28);ctx.fill();}
  }
  ctx.fillStyle='#22c55e';ctx.fillRect(POS.ENTRADA.x*W-4,POS.ENTRADA.y*H-4,W+8,H+8);ctx.fillStyle='#000';ctx.font='bold 8px Arial';ctx.fillText('ENTRADA',POS.ENTRADA.x*W-2,POS.ENTRADA.y*H+4);
  for(let i=0;i<rastro.length;i++){let p=rastro[i];let a=(i+1)/rastro.length;ctx.fillStyle=`rgba(34,197,94,${0.4+a*0.6})`;ctx.beginPath();ctx.arc(p.x*W+20,p.y*H+13,6*a+2,0,6.28);ctx.fill();}
  if(!(tx==POS.WAY.x&&ty==POS.WAY.y)){ctx.fillStyle='#ef4444';ctx.fillRect(tx*W-2,ty*H-2,W+4,H+4);}
  flagRect=null;
  if(px==tx&&py==ty&&!(tx==POS.WAY.x&&ty==POS.WAY.y)){
    if(!caixaAtual) caixaAtual=pegaCaixaLivre();
    let bx=tx*W,by=ty*H;
    let flagW=160,flagH=108;
    let flagY=by+28,fx=bx-38;
    if(fx<camX) fx=camX+4; if(fx+flagW>camX+vw) fx=camX+vw-flagW-4;
    if(flagY+flagH>camY+vh) flagY=by-flagH-12;
    flagRect={x:fx,y:flagY,w:flagW,h:flagH,bx:bx,by:by};
    ctx.fillStyle='#facc15';ctx.fillRect(bx+18,by+22,4,60);
    ctx.fillStyle='#fff';ctx.fillRect(fx,flagY,flagW,flagH);ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.strokeRect(fx,flagY,flagW,flagH);
    // foto emoji discreto canto
    ctx.fillStyle='#f3f4f6';ctx.fillRect(fx+110,flagY+6,42,26);ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;ctx.strokeRect(fx+110,flagY+6,42,26);
    ctx.fillStyle='#000';ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(icons[produtoAtual]||"📦",fx+131,flagY+24);ctx.textAlign='left';
    try{if(produtoAtual=="TANG 364" && tangImg.complete && tangImg.naturalWidth>0){ctx.drawImage(tangImg,fx+110,flagY+6,42,26);}}catch(e){}
    // textos principais
    ctx.fillStyle='#000';ctx.font='bold 11px Arial';ctx.fillText('📍 '+produtoAtual,fx+6,flagY+15);
    ctx.fillStyle='#16a34a';ctx.font='bold 15px Arial';ctx.fillText(precos[produtoAtual]||"R$ 9,99",fx+6,flagY+34);
    ctx.fillStyle='#1e40af';ctx.font='bold 11px Arial';ctx.fillText(`CAIXA ${caixaAtual.id} • F:${caixaAtual.fila}`,fx+6,flagY+51);
    // VOTAÇÃO DISCRETA - LINHA FININHA
    let vm=getMedia(produtoAtual);
    ctx.fillStyle='#9ca3af';ctx.font='8px Arial';ctx.fillText(`★ ${vm.media||'--'} (${vm.q} votos)`,fx+6,flagY+64);
    // 5 estrelinhas pequenas clicáveis
    ctx.font='11px Arial';let starX=fx+6,starY=flagY+76;
    for(let i=1;i<=5;i++){
      let preenchida=votos[produtoAtual] && (votos[produtoAtual].s/votos[produtoAtual].q)>=i;
      ctx.fillStyle=i<=Math.round(vm.media)?'#facc15':'#e5e7eb';
      ctx.fillText('★',starX+(i-1)*13,starY);
    }
    ctx.fillStyle='#9ca3af';ctx.font='7px Arial';ctx.fillText('toque pra votar',fx+75,flagY+77);
    ctx.fillStyle='#22c55e';ctx.font='bold 8px Arial';ctx.fillText(`✅ ${caixas.filter(c=>c.fila<2).length}/31`,fx+6,flagY+92);
    ctx.fillStyle='#6b7280';ctx.font='7px Arial';ctx.fillText(`${caixaAtual.fila*2}min`,fx+70,flagY+92);
  }
  ctx.fillStyle='#facc15';ctx.shadowColor='#facc15';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(px*W+20,py*H+13,11,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.restore();
  let vm=getMedia(produtoAtual);
  document.getElementById('console').innerText=`V54.4 VOTO | ${produtoAtual} | ★${vm.media||'--'} (${vm.q}) | CAIXA ${caixaAtual?caixaAtual.id:'-'} | TOQUE NA ESTRELA PRA VOTAR`;
  localStorage.setItem('v54_pos',JSON.stringify({px,py}));
}
function step(){if(cam.length==0){clearInterval(tm);tm=null;if(!caixaAtual) caixaAtual=pegaCaixaLivre();draw();return;}let p=cam.shift();rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=p.x;py=p.y;dot[py][px]=false;draw();}
function mover(dx,dy){if(tm){clearInterval(tm);tm=null;}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=nx;py=ny;dot[py][px]=false;draw();}
function ir(x,y){caixaAtual=null;flagRect=null;if(tm){clearInterval(tm);tm=null;}if(x==POS.WAY.x&&y==POS.WAY.y) rastro=[];tx=x;ty=y;cam=achar(px,py,x,y);if(cam.length==0){rastro.push({x:px,y:py});px=x;py=y;draw();return;}tm=setInterval(step,120);draw();}
function loop(){updateCam();draw();requestAnimationFrame(loop);}
init();resize();draw();loop();
let sx=0,sy=0;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
cv.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<20&&Math.abs(dy)<20){
  // verifica clique na votação
  if(flagRect && px==tx && py==ty){
    let rect=cv.getBoundingClientRect();
    let cx=e.changedTouches[0].clientX-rect.left, cy=e.changedTouches[0].clientY-rect.top;
    let worldX=cx+camX, worldY=cy+camY;
    if(worldX>=flagRect.x && worldX<=flagRect.x+flagRect.w && worldY>=flagRect.y+70 && worldY<=flagRect.y+80){
      let estrela=Math.floor((worldX-(flagRect.x+6))/13)+1;
      if(estrela>=1&&estrela<=5){votar(produtoAtual,estrela);caixaAtual=null;draw();return;}
    }
  }
  return;
} if(Math.abs(dx)>Math.abs(dy)){mover(dx>0?1:-1,0)}else{mover(0,dy>0?1:-1)}});
// clique mouse tbm
cv.addEventListener('click',e=>{
  if(!flagRect ||!(px==tx&&py==ty)) return;
  let rect=cv.getBoundingClientRect();
  let cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  let worldX=cx+camX, worldY=cy+camY;
  if(worldX>=flagRect.x && worldX<=flagRect.x+flagRect.w && worldY>=flagRect.y+70 && worldY<=flagRect.y+85){
    let estrela=Math.floor((worldX-(flagRect.x+6))/13)+1;
    if(estrela>=1&&estrela<=5){votar(produtoAtual,estrela);caixaAtual=null;draw();}
  }
});
</script>
</body>
</html>
