<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>364 V20 LEVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#gps{ background:#111; border-bottom:1px solid #22c55e; color:#22c55e; padding:4px; font-size:9px; text-align:center; flex-shrink:0 }
#game{flex:1;overflow:auto;background:#000}
#map{display:grid;gap:1px;background:#222;padding:2px;width:max-content;margin:auto}
.cell{width:11px;height:11px;display:flex;align-items:center;justify-content:center;font-size:3px}
.wall{background:#1e40af}
.corr{background:#000}
.caixa{background:#fde68a;color:#000;font-size:3px}
.player{background:#facc15!important;border-radius:50%;font-size:7px}
#bottom{background:#111;border-top:1px solid #facc15;padding:4px;flex-shrink:0}
#controls{display:flex;justify-content:center;gap:4px}
#controls button{width:36px;height:28px;background:#222;color:#facc15;border:1px solid #facc15;border-radius:6px}
</style>
</head>
<body>
<div id="gps">📍 GPS: Toque em 📍GPS</div>
<div id="game"><div id="map"></div></div>
<div id="bottom">
<div id="controls">
<button onclick="mover(-1,0)">←</button>
<button onclick="mover(0,-1)">↑</button>
<button onclick="mover(0,1)">↓</button>
<button onclick="mover(1,0)">→</button>
<button onclick="ativarGPS()" style="background:#22c55e;color:#000;width:55px;font-size:8px">📍GPS</button>
</div>
</div>
<script>
const COLS=40, ROWS=19; let px=15,py=18, lat=0,lng=0,gps=false;
let lab=[];
for(let y=0;y<ROWS;y++){
 lab[y]=[];
 for(let x=0;x<COLS;x++){
  if(y==18 && x>=14 && x<=26) lab[y][x]=2;
  else if(y==0||y==17||y==8||x==0||x==COLS-1) lab[y][x]=0;
  else lab[y][x]=(x%3<2)?1:0;
 }
}
function criar(){
 const m=document.getElementById('map'); m.style.gridTemplateColumns=`repeat(${COLS},11px)`;
 for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
  let c=document.createElement('div'); c.className='cell'; c.id=`c-${x}-${y}`;
  let v=lab[y][x]; if(v==1) c.classList.add('wall'); else if(v==2){c.classList.add('caixa'); c.innerText='0,0';} else c.classList.add('corr');
  m.appendChild(c);
 } atualiza();
}
function atualiza(){
 document.querySelectorAll('.player').forEach(e=>{e.classList.remove('player'); if(e.classList.contains('caixa')) e.innerText='0,0'; else e.innerText='';});
 document.getElementById(`c-${px}-${py}`).classList.add('player');
 document.getElementById(`c-${px}-${py}`).innerText='🛒';
 let b=Math.floor(px/3)+1;
 document.getElementById('gps').innerText= gps? `📍 ${lat.toFixed(5)},${lng.toFixed(5)} | B${b} X:${px} Y:${py} | VOLTA TOTAL OK` : `B${b} X:${px} Y:${py} | VOLTA TOTAL | Toque 📍GPS`;
 document.getElementById('game').scrollLeft=(px*11)-50;
}
function mover(dx,dy){
 let nx=px+dx, ny=py+dy; if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return;
 if(document.getElementById(`c-${nx}-${ny}`).classList.contains('wall')) return;
 px=nx; py=ny; atualiza();
}
function ativarGPS(){
 if(!navigator.geolocation){document.getElementById('gps').innerText='Sem GPS'; return;}
 document.getElementById('gps').innerText='Buscando GPS... Permita';
 navigator.geolocation.getCurrentPosition(p=>{ // get uma vez só, não watch que trava
  gps=true; lat=p.coords.latitude; lng=p.coords.longitude; atualiza();
 },null,{enableHighAccuracy:true});
}
criar();
</script>
</body>
</html>
