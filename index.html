<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{background:#000;margin:0}canvas{border:3px solid yellow}</style>
</head>
<body>
<canvas id="c" width="800" height="380"></canvas>
<br>
<button onclick="mover(-1,0)">←</button>
<button onclick="mover(0,-1)">↑</button>
<button onclick="mover(0,1)">↓</button>
<button onclick="mover(1,0)">→</button>
<button onclick="ir(38,1)">TANG</button>
<button onclick="ir(2,16)">WAY</button>
<script>
const COLS=40,ROWS=19,W=20,H=20;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let px=3,py=8,tx=2,ty=16,cam=[],tm=null;
let lab=[],dot=[];
for(let y=0;y<ROWS;y++){lab[y]=[];dot[y]=[];for(let x=0;x<COLS;x++){lab[y][x]=(y==0||y==8||y==17||x==0||x==39)?0:(x%5<3)?1:0;dot[y][x]=lab[y][x]==0;}}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v=new Set([sx+','+sy]);while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v.has(k)&&livre(nx,ny)){v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]})}}}return []}
function draw(){
ctx.fillStyle='#000';ctx.fillRect(0,0,800,380);
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
 if(lab[y][x]==1){ctx.fillStyle='blue';ctx.fillRect(x*W,y*H,W,H);}
 else if(dot[y][x]){ctx.fillStyle='yellow';ctx.beginPath();ctx.arc(x*W+10,y*H+10,3,0,6.28);ctx.fill();}
}
ctx.fillStyle='red';ctx.fillRect(tx*W,ty*H,W,H);
ctx.fillStyle='yellow';ctx.beginPath();ctx.arc(px*W+10,py*H+10,9,0,6.28);ctx.fill();
}
function step(){if(cam.length==0){clearInterval(tm);tm=null;return;}let p=cam.shift();px=p.x;py=p.y;dot[py][px]=false;draw();}
function mover(dx,dy){if(tm)clearInterval(tm);let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;px=nx;py=ny;dot[py][px]=false;draw();}
function ir(x,y){if(tm)clearInterval(tm);tx=x;ty=y;cam=achar(px,py,x,y);tm=setInterval(step,150);draw();}
draw();
cam=achar(px,py,tx,ty);tm=setInterval(step,150);
alert('RODOU! Se viu isso o mapa apareceu');
</script>
</body>
</html>
