<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V54.8 13 GONDOLAS 1-26</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#gps{background:#facc15;color:#000;padding:8px;text-align:center;font-size:11px;font-weight:bold}
#console{background:#111;color:#22c55e;padding:5px;font-family:monospace;font-size:9px;max-height:60px;overflow:auto;border-bottom:2px solid #facc15}
canvas{flex:1;width:100%;background:#000;border:3px solid #facc15;touch-action:none;display:block}
.btns{display:grid;grid-template-columns:repeat(4,1fr) 1.5fr 1fr;gap:6px;padding:8px;background:#0a0a0a}
button{height:54px;border-radius:12px;border:2px solid #facc15;font-weight:bold}
.bm{background:#222;color:#facc15;font-size:20px}
.bway{background:#22c55e;color:#000;font-size:11px}
#combo{height:54px;border-radius:12px;border:2px solid #facc15;background:#fff;color:#000;font-weight:bold;font-size:12px;padding:0 8px;width:100%}
</style>
</head>
<body>
<div id="gps">V54.8 - 13 GONDOLAS 1-2 ATE 25-26</div>
<div id="console">OK - 40 ITENS COM EMOJI - 13 COLUNAS</div>
<canvas id="c"></canvas>
<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<select id="combo" onchange="trocarProduto()">
<option value="24,1">🧃 TANG [1-2]</option>
<option value="2,2">🍚 ARROZ [25-26]</option>
<option value="4,2">🫘 FEIJAO [23-24]</option>
<option value="6,2">🫒 OLEO [21-22]</option>
<option value="8,2">🍬 ACUCAR [19-20]</option>
<option value="10,2">☕ CAFE [17-18]</option>
<option value="12,2">🍝 MACARRAO [15-16]</option>
<option value="14,2">🍪 BISCOITO [13-14]</option>
<option value="16,2">🥛 LEITE [11-12]</option>
<option value="18,2">🧈 MANTEIGA [9-10]</option>
<option value="20,2">🧀 QUEIJO [7-8]</option>
<option value="22,2">🥤 REFRI [5-6]</option>
<option value="24,2">💧 AGUA [3-4]</option>
<option value="2,5">🍺 CERVEJA [25-26]</option>
<option value="4,5">🧃 SUCO [23-24]</option>
<option value="6,5">⚡ ENERGETICO [21-22]</option>
<option value="8,5">🧼 SABAO PO [19-20]</option>
<option value="10,5">🧴 DETERGENTE [17-18]</option>
<option value="12,5">👕 AMACIANTE [15-16]</option>
<option value="14,5">✨ DESINFETANTE [13-14]</option>
<option value="16,5">🧻 PAPEL HIG [11-12]</option>
<option value="18,5">🧼 SABONETE [9-10]</option>
<option value="20,5">💆 SHAMPOO [7-8]</option>
<option value="22,5">🪥 CREME DENTAL [5-6]</option>
<option value="24,5">💨 DESODORANTE [3-4]</option>
<option value="2,10">🍞 PAO [25-26]</option>
<option value="4,10">🍰 BOLO [23-24]</option>
<option value="6,10">🍖 PRESUNTO [21-22]</option>
<option value="8,10">🧀 MUSSARELA [19-20]</option>
<option value="10,10">🥩 CARNE [17-18]</option>
<option value="12,10">🍗 FRANGO [15-16]</option>
<option value="14,10">🌭 LINGUICA [13-14]</option>
<option value="16,10">🥚 OVOS [11-12]</option>
<option value="18,10">🍅 TOMATE [9-10]</option>
<option value="20,10">🥔 BATATA [7-8]</option>
<option value="22,10">🧅 CEBOLA [5-6]</option>
<option value="24,10">🍌 BANANA [3-4]</option>
<option value="2,12">🍎 MACA [25-26]</option>
<option value="4,12">🐶 RACAO CAO [23-24]</option>
<option value="6,12">🐱 RACAO GATO [21-22]</option>
</select>
<button class="bway" onclick="ir(26,15)">ENTRADA</button>
</div>
<script>
const COLS=27,ROWS=19,W=40,H=26;
let lab=[],dot=[],px=26,py=15,tx=26,ty=15,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0;
let produtoAtual="TANG 364";
let caixas=[];for(let i=0;i<31;i++) caixas.push({id:i+1,fila:Math.floor(Math.random()*4)});
let precos={"TANG 364":"R$ 1,49","ARROZ 5KG":"R$ 22,90","FEIJAO 1KG":"R$ 8,99","OLEO 900ML":"R$ 7,49","ACUCAR 1KG":"R$ 4,99","CAFE 500G":"R$ 14,90","MACARRAO":"R$ 3,99","BISCOITO":"R$ 3,49","LEITE 1L":"R$ 4,89","MANTEIGA":"R$ 9,90","QUEIJO":"R$ 29,90","REFRI 2L":"R$ 8,99","AGUA 500ML":"R$ 2,49","CERVEJA":"R$ 3,99","SUCO CAIXA":"R$ 6,99","ENERGETICO":"R$ 7,99","SABAO PO":"R$ 12,90","DETERGENTE":"R$ 2,49","AMACIANTE":"R$ 9,90","DESINFETANTE":"R$ 6,99","PAPEL HIG":"R$ 15,90","SABONETE":"R$ 2,99","SHAMPOO":"R$ 15,90","CREME DENTAL":"R$ 4,99","DESODORANTE":"R$ 12,90","PAO FRANCES":"R$ 0,89","BOLO":"R$ 6,90","PRESUNTO":"R$ 32,90","MUSSARELA":"R$ 39,90","CARNE MOIDA":"R$ 29,90","FRANGO":"R$ 18,90","LINGUICA":"R$ 22,90","OVOS 12UN":"R$ 14,90","TOMATE":"R$ 7,90","BATATA":"R$ 5,90","CEBOLA":"R$ 4,90","BANANA":"R$ 6,90","MACA":"R$ 9,90","RACAO CAO":"R$ 89,90","RACAO GATO":"R$ 79,90"};
let icons={"TANG 364":"🧃","ARROZ 5KG":"🍚","FEIJAO 1KG":"🫘","OLEO 900ML":"🫒","ACUCAR 1KG":"🍬","CAFE 500G":"☕","MACARRAO":"🍝","BISCOITO":"🍪","LEITE 1L":"🥛","MANTEIGA":"🧈","QUEIJO":"🧀","REFRI 2L":"🥤","AGUA 500ML":"💧","CERVEJA":"🍺","SUCO CAIXA":"🧃","ENERGETICO":"⚡","SABAO PO":"🧼","DETERGENTE":"🧴","AMACIANTE":"👕","DESINFETANTE":"✨","PAPEL HIG":"🧻","SABONETE":"🧼","SHAMPOO":"💆","CREME DENTAL":"🪥","DESODORANTE":"💨","PAO FRANCES":"🍞","BOLO":"🍰","PRESUNTO":"🍖","MUSSARELA":"🧀","CARNE MOIDA":"🥩","FRANGO":"🍗","LINGUICA":"🌭","OVOS 12UN":"🥚","TOMATE":"🍅","BATATA":"🥔","CEBOLA":"🧅","BANANA":"🍌","MACA":"🍎","RACAO CAO":"🐶","RACAO GATO":"🐱"};
let caixaAtual=null;
function pegaCaixa(){caixas.sort((a,b)=>a.fila-b.fila);let c=caixas[0];c.fila++;setTimeout(function(){c.fila=Math.max(0,c.fila-1)},20000);return c;}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function trocarProduto(){let sel=document.getElementById('combo');let txt=sel.options[sel.selectedIndex].text;let clean=txt.substring(2).trim().split(' [')[0];produtoAtual=clean;if(clean=='TANG') produtoAtual='TANG 364'; if(clean=='REFRI') produtoAtual='REFRI 2L'; if(clean=='AGUA') produtoAtual='AGUA 500ML'; if(clean=='CERVEJA') produtoAtual='CERVEJA'; if(clean=='SUCO') produtoAtual='SUCO CAIXA'; if(clean=='ENERGETICO') produtoAtual='ENERGETICO'; if(clean=='SABAO PO') produtoAtual='SABAO PO'; if(clean=='DETERGENTE') produtoAtual='DETERGENTE'; if(clean=='AMACIANTE') produtoAtual='AMACIANTE'; if(clean=='DESINFETANTE') produtoAtual='DESINFETANTE'; if(clean=='PAPEL HIG') produtoAtual='PAPEL HIG'; if(clean=='SABONETE') produtoAtual='SABONETE'; if(clean=='SHAMPOO') produtoAtual='SHAMPOO'; if(clean=='CREME DENTAL') produtoAtual='CREME DENTAL'; if(clean=='DESODORANTE') produtoAtual='DESODORANTE'; if(clean=='PAO') produtoAtual='PAO FRANCES'; if(clean=='BOLO') produtoAtual='BOLO'; if(clean=='PRESUNTO') produtoAtual='PRESUNTO'; if(clean=='MUSSARELA') produtoAtual='MUSSARELA'; if(clean=='CARNE') produtoAtual='CARNE MOIDA'; if(clean=='FRANGO') produtoAtual='FRANGO'; if(clean=='LINGUICA') produtoAtual='LINGUICA'; if(clean=='OVOS') produtoAtual='OVOS 12UN'; if(clean=='TOMATE') produtoAtual='TOMATE'; if(clean=='BATATA') produtoAtual='BATATA'; if(clean=='CEBOLA') produtoAtual='CEBOLA'; if(clean=='BANANA') produtoAtual='BANANA'; if(clean=='MACA') produtoAtual='MACA'; if(clean=='RACAO CAO') produtoAtual='RACAO CAO'; if(clean=='RACAO GATO') produtoAtual='RACAO GATO'; if(clean=='ARROZ') produtoAtual='ARROZ 5KG'; if(clean=='FEIJAO') produtoAtual='FEIJAO 1KG'; if(clean=='OLEO') produtoAtual='OLEO 900ML'; if(clean=='ACUCAR') produtoAtual='ACUCAR 1KG'; if(clean=='CAFE') produtoAtual='CAFE 500G'; if(clean=='MACARRAO') produtoAtual='MACARRAO'; if(clean=='BISCOITO') produtoAtual='BISCOITO'; if(clean=='LEITE') produtoAtual='LEITE 1L'; if(clean=='MANTEIGA') produtoAtual='MANTEIGA'; if(clean=='QUEIJO') produtoAtual='QUEIJO'; let v=sel.value.split(',');ir(parseInt(v[0]),parseInt(v[1]));}
function init(){lab=[];dot=[];for(let y=0;y<ROWS;y++){lab[y]=[];dot[y]=[];for(let x=0;x<COLS;x++){if(y==0||y==8||y==17||x==0||x==COLS-1) lab[y][x]=0; else if(x%2==1) lab[y][x]=1; else lab[y][x]=0; dot[y][x]=lab[y][x]==0;}}}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v={};v[sx+','+sy]=1;while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;let dirs=[[1,0],[-1,0],[0,1],[0,-1]];for(let i=0;i<dirs.length;i++){let nx=c.x+dirs[i][0],ny=c.y+dirs[i][1],k=nx+','+ny;if(!v[k]&&livre(nx,ny)){v[k]=1;q.push({x:nx,y:ny,p:c.p.concat([{x:nx,y:ny}])})}}}return []}
function resize(){let r=cv.getBoundingClientRect();vw=r.width;vh=r.height;if(vh<300) vh=400;cv.width=vw;cv.height=vh;}
window.addEventListener('resize',function(){resize();draw();});
function updateCam(){let tX=px*W - vw/2 + W/2, tY=py*H - vh/2 + H/2; camX+=(tX-camX)*0.12; camY+=(tY-camY)*0.12;let maxX=Math.max(0,COLS*W-vw);let maxY=Math.max(0,ROWS*H-vh);if(camX<0) camX=0; if(camX>maxX) camX=maxX; if(camY<0) camY=0; if(camY>maxY) camY=maxY;}
function draw(){
  updateCam();ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(-camX,-camY);
  for(let y=0;y<ROWS;y++){for(let x=0;x<COLS;x++){
    if(lab[y][x]==1){
      ctx.fillStyle='#0a194e';ctx.fillRect(x*W,y*H,W,H);ctx.fillStyle='#1e40af';ctx.fillRect(x*W+1,y*H+1,W-2,H-2);
      ctx.fillStyle='#facc15';ctx.font='bold 10px Arial';ctx.textAlign='left';
      let n='';if(x==25)n='1-2';else if(x==23)n='3-4';else if(x==21)n='5-6';else if(x==19)n='7-8';else if(x==17)n='9-10';else if(x==15)n='11-12';else if(x==13)n='13-14';else if(x==11)n='15-16';else if(x==9)n='17-18';else if(x==7)n='19-20';else if(x==5)n='21-22';else if(x==3)n='23-24';else if(x==1)n='25-26';
      ctx.fillText(n,x*W+3,y*H+16);
    } else if(dot[y][x] && y!=0){ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(x*W+20,y*H+13,2.5,0,6.28);ctx.fill();}
  }}
  ctx.fillStyle='#22c55e';ctx.fillRect(26*W-4,15*H-4,W+8,H+8);ctx.fillStyle='#000';ctx.font='bold 7px Arial';ctx.fillText('ENTRADA',26*W-3,15*H+4);
  for(let i=0;i<rastro.length;i++){let p=rastro[i];let a=(i+1)/rastro.length;ctx.fillStyle='rgba(34,197,94,'+(0.4+a*0.6)+')';ctx.beginPath();ctx.arc(p.x*W+20,p.y*H+13,6*a+2,0,6.28);ctx.fill();}
  if(!(tx==26&&ty==15)){ctx.fillStyle='#ef4444';ctx.fillRect(tx*W-2,ty*H-2,W+4,H+4);}
  if(px==tx&&py==ty&&!(tx==26&&ty==15)){
    if(!caixaAtual) caixaAtual=pegaCaixa();
    let bx=tx*W,by=ty*H,flagW=165,flagH=85,flagY=by+28,fx=bx-35;if(fx<camX) fx=camX+4; if(fx+flagW>camX+vw) fx=camX+vw-flagW-4; if(flagY+flagH>camY+vh) flagY=by-flagH-10;
    ctx.fillStyle='#facc15';ctx.fillRect(bx+18,by+22,4,60);ctx.fillStyle='#fff';ctx.fillRect(fx,flagY,flagW,flagH);ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.strokeRect(fx,flagY,flagW,flagH);
    ctx.fillStyle='#f3f4f6';ctx.fillRect(fx+108,flagY+6,48,32);ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;ctx.strokeRect(fx+108,flagY+6,48,32);
    ctx.font='24px Arial';ctx.textAlign='center';ctx.fillText(icons[produtoAtual]||'📦',fx+132,flagY+28);ctx.textAlign='left';
    ctx.fillStyle='#000';ctx.font='bold 11px Arial';ctx.fillText(produtoAtual,fx+6,flagY+16);
    ctx.fillStyle='#16a34a';ctx.font='bold 16px Arial';ctx.fillText(precos[produtoAtual]||'R$ 9,99',fx+6,flagY+36);
    ctx.fillStyle='#1e40af';ctx.font='bold 10px Arial';ctx.fillText('CAIXA '+caixaAtual.id+' F:'+caixaAtual.fila,fx+6,flagY+54);
    ctx.fillStyle='#666';ctx.font='bold 8px Arial';ctx.fillText(caixas.filter(function(c){return c.fila<2}).length+'/31 livres',fx+6,flagY+70);
  }
  ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(px*W+20,py*H+13,11,0,6.28);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
  document.getElementById('console').innerText='V54.8 13 COLUNAS | '+(icons[produtoAtual]||'')+' '+produtoAtual+' '+(precos[produtoAtual]||'')+' | GONDOLA '+(tx%2==0? (tx==26?'ENTRADA':(26-tx)+'?' ):'')+' | PONTO A PONTO';
}
function step(){if(cam.length==0){clearInterval(tm);tm=null;if(!caixaAtual) caixaAtual=pegaCaixa();draw();return;}let p=cam.shift();rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=p.x;py=p.y;dot[py][px]=false;draw();}
function mover(dx,dy){if(tm){clearInterval(tm);tm=null;}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=nx;py=ny;dot[py][px]=false;draw();}
function ir(x,y){caixaAtual=null;if(tm){clearInterval(tm);tm=null;}if(x==26&&y==15) rastro=[];if(lab[y][x]==1){if(x>0&&lab[y][x-1]!=1) x--; else if(x<COLS-1&&lab[y][x+1]!=1) x++;}tx=x;ty=y;cam=achar(px,py,x,y);if(cam.length==0){px=x;py=y;draw();return;}tm=setInterval(step,110);draw();}
function loop(){updateCam();draw();requestAnimationFrame(loop);}
init();resize();draw();loop();
let sx=0,sy=0;cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
cv.addEventListener('touchend',function(e){let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<20&&Math.abs(dy)<20) return; if(Math.abs(dx)>Math.abs(dy)){mover(dx>0?1:-1,0)}else{mover(0,dy>0?1:-1)}});
</script>
</body>
</html>
