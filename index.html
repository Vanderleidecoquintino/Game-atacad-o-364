<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atacadão 364 - V3.1 FIX</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;text-align:center;margin:0;padding:10px}
#gameBox{width:95%;max-width:400px;height:460px;margin:10px auto;border:4px solid #facc15;border-radius:15px;background:#1e3a8a;position:relative;overflow:hidden}
.corredor{position:absolute;width:5%;height:90%;background:#1e40af;top:5%;border-radius:3px;text-align:center}
#player{position:absolute;font-size:32px;transition:all 0.3s;z-index:10;left:2%;top:20px}
#camera{position:absolute;width:44px;height:44px;background:white;border-radius:8px;opacity:0.8;left:1%;top:16px}
#slider{width:90%;accent-color:#facc15;direction:rtl}
.btn{width:90%;padding:15px;border:none;border-radius:10px;font-weight:bold;margin:5px;font-size:16px}
.btn-gps{background:#22c55e;color:white}
.btn-entrada{background:#facc15;color:black}
#caixaMissao{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;background:#0f172a;border:3px solid #facc15;border-radius:15px;padding:15px;z-index:20;text-align:left}
.tag{background:#1e3a8a;padding:4px 8px;border-radius:6px;margin:2px;display:inline-block;font-size:12px}
#confetti{position:fixed;top:20%;left:5%;width:90%;background:#22c55e;color:white;padding:20px;border-radius:15px;display:none;z-index:30;font-size:20px;font-weight:bold}
</style>
</head>

    <p id="gpsInfo" style="background:#1e40af;padding:6px;border-radius:6px;font-size:13px">📡 [ GPS: 120m → Nordeste ]</p>

  </div>
</div>
<label>364 TANG ◄► WHEY 1</label><br>
<input type="range" id="slider" min="1" max="364" value="364">
