<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V54 - COMBO BOX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#gps{background:#facc15;color:#000;padding:8px;text-align:center;font-size:11px;font-weight:bold;cursor:pointer}
#console{background:#111;color:#22c55e;padding:5px;font-family:monospace;font-size:9px;white-space:pre;line-height:11px;max-height:60px;overflow:auto;border-bottom:2px solid #facc15}
canvas{flex:1;width:100%;background:#000;border:3px solid #facc15;touch-action:none}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:#0a0a0a}
.combo-area{background:#0a0a0a;padding:8px;display:flex;gap:6px}
#combo{flex:1;height:54px;background:#1a1a1a;color:#facc15;border:2px solid #facc15;border-radius:12px;font-weight:bold;padding:0 12px;font-size:14px}
button{height:54px;border-radius:12px;border:2px solid #facc15;font-weight:bold}
.bm{background:#222;color:#facc15;font-size:20px}
.bprod{background:#a855f7;color:#fff;font-size:11px}
.bway{background:#22c55e;color:#000;font-size:11px}
</style>
</head>
<body>
<div id="gps" onclick="GPS.iniciar()">📍 CLICA AQUI PRA LIGAR O GPS</div>
<div id="console"></div>
<canvas id="c"></canvas>

<div class="combo-area">
<select id="combo" onchange="trocarProduto()">
<option value="10,1">📍 TANG 364 - C11</option>
<option value="2,2">🍚 ARROZ - C3</option>
<option value="4,2">🫘 FEIJÃO - C5</option>
<option value="6,2">🛢️ ÓLEO - C7</option>
<option value="8,2">🍪 BISCOITO - C9</option>
<option value="2,5">🥤 REFRIGERANTE - C3</option>
<option value="4,5">🧹 LIMPEZA - C5</option>
<option value="6,5">🧴 HIGIENE - C7</option>
<option value="8,5">🧀 FRIOS - C9</option>
<option value="2,10">🍞 PADARIA - C3</option>
<option value="4,10">🥩 CARNES - C5</option>
<option value="6,10">🍎 FRUTAS - C7</option>
<option value="8,10">🍺 BEBIDAS - C9</option>
<option value="10,10">🐶 RAÇÃO - C11</option>
</select>
<button class="bway" style="width:110px" onclick="ir(POS.WAY.x,POS.WAY.y)">ENTRADA</button>
</div>

<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
</div>

<script>
const COLS=13,ROWS=19,W=40,H=26;
const POS={WAY:{x:12,y:15},ENTRADA:{x:12,y:15}};
let produtoAtual="TANG 364";
let lab=[],dot=[],px=12,py=15,tx=10,ty=1,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const tangImg=new Image();tangImg.src='IMG-20260926-WA7510.jpg';

const GPS={
  lat:null,lng:null,ativo:false,
  iniciar(){
    if(!navigator.geolocation){document.getElementById('gps').innerText='GPS NÃO SUPORTADO';return;}
    document.getElementById('gps').innerText='🔍 BUSCANDO GPS...';
    navigator.geolocation.watchPosition(p=>{
      this.lat=p.coords.latitude;this.lng=p.coords.longitude;this.ativo=true;
      document.getElementById('gps').style.background='#22c55e';
      document.getElementById('gps').innerText=`🟢 GPS ON | ${this.lat.toFixed(5)}, ${this.lng.toFixed(5)} | VOCE X:${px} Y:${py}`;
    },e=>{
      document.getElementById('gps').style.background='#ef4444';
      document.getElementById('gps').innerText=`🔴 GPS ERRO: ${e.message}`;
    },{enableHighAccuracy:true,maximumAge:0,timeout:10000});
  }
};

function trocarProduto(){
  let v=document.getElementById('combo').value.split(',');
  let nome=document.getElementById('combo').options[document.getElementById('combo').selectedIndex].text;
  produtoAtual=nome;
  ir(parseInt(v[0]),parseInt(v[1]));
}

function init(){
  for(let y=0;y<ROWS;y++){lab[y]=[];dot[y]=[];for(let x=0;x<COLS;x++){
    if(y==0||y==8||y==17||x==0||x==12) lab[y][x]=0; else if(x%2==1) lab[y][x]=1; else lab[y][x]=0; dot[y][x]=lab[y][x]==0;
  }}
  let s=localStorage.getItem('v54_pos'); if(s){try{let p=JSON.parse(s);px=p.px;py=p.py;}catch(e){}}
}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y]
