<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V54 - FOTO REAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#gps{background:#facc15;color:#000;padding:8px;text-align:center;font-size:11px;font-weight:bold;cursor:pointer}
#console{background:#111;color:#22c55e;padding:5px;font-family:monospace;font-size:9px;white-space:pre;line-height:11px;max-height:60px;overflow:auto;border-bottom:2px solid #facc15}
canvas{flex:1;width:100%;background:#000;border:3px solid #facc15;touch-action:none}
.btns{display:grid;grid-template-columns:repeat(4,1fr) 1.5fr 1fr;gap:6px;padding:8px;background:#0a0a0a}
button{height:54px;border-radius:12px;border:2px solid #facc15;font-weight:bold}
.bm{background:#222;color:#facc15;font-size:20px}
.bway{background:#22c55e;color:#000;font-size:11px}
#combo{height:54px;border-radius:12px;border:2px solid #facc15;background:#fff;color:#000;font-weight:bold;font-size:14px;padding:0 8px;width:100%}
</style>
</head>
<body>
<div id="gps" onclick="GPS.iniciar()">📍 CLICA AQUI PRA LIGAR O GPS</div>
<div id="console"></div>
<canvas id="c"></canvas>
<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<select id="combo" onchange="trocarProduto()">
<option value="10,1">TANG 364</option>
<option value="2,2">ARROZ</option>
<option value="4,2">FEIJÃO</option>
<option value="6,2">ÓLEO</option>
<option value="8,2">BISCOITO</option>
<option value="2,5">REFRI</option>
<option value="4,5">LIMPEZA</option>
<option value="6,5">HIGIENE</option>
<option value="8,5">FRIOS</option>
<option value="2,10">PADARIA</option>
<option value="4,10">CARNES</option>
<option value="6,10">FRUTAS</option>
<option value="8,10">BEBIDAS</option>
<option value="10,10">RAÇÃO</option>
</select>
<button class="bway" onclick="ir(12,15)">ENTRADA</button>
</div>
<script>
const COLS=13,ROWS=19,W=40,H=26;
const POS={WAY:{x:12,y:15},ENTRADA:{x:12,y:15}};
let lab=[],dot=[],px=12,py=15,tx=12,ty=15,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0;
let produtoAtual="TANG 364";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// FOTOS REAIS - IGUAL TANG
const listaFotos = {
"TANG 364":"IMG-20260926-WA7510.jpg",
"ARROZ":"arroz.jpg",
"FEIJÃO":"feijao.jpg",
"ÓLEO":"oleo.jpg",
"BISCOITO":"biscoito.jpg",
"REFRI":"refri.jpg",
"LIMPEZA":"limpeza.jpg",
"HIGIENE":"higiene.jpg",
"FRIOS":"frios.jpg",
"PADARIA":"padaria.jpg",
"CARNES":"carnes.jpg",
"FRUTAS":"frutas.jpg",
"BEBIDAS":"bebidas.jpg",
"RAÇÃO":"racao.jpg"
};
let IMGS={};
for(let k in listaFotos){let im=new Image();im.src=listaFotos[k];IMGS[k]=im;}

const GPS={
  lat:null,lng:null,ativo:false,
  iniciar(){
    if(!navigator.geolocation){document.getElementById('gps').innerText='GPS NÃO SUPORTADO';return;}
    document.getElementById('gps').innerText='🔍 BUSCANDO GPS...';
    navigator.geolocation.watchPosition(p=>{
      this.lat=p.coords.latitude;this.lng=p.coords.longitude;this.ativo=true;
      document.getElementById('gps').style.background='#22c55e';
      document.getElementById('gps').innerText=`🟢 GPS ON | ${this.lat.toFixed(5)}`;
    },e=>{
      document.getElementById('gps').style.background='#ef4444';
      document.getElementById('gps').innerText=`🔴 ERRO: ${e.message}`;
    },{enableHighAccuracy:true,maximumAge:0,timeout:10000});
  }
};
function trocarProduto(){
  let sel=document.getElementById('combo');
  let v=sel.value.split(',');
  produtoAtual=sel.options[sel.selectedIndex].text;
  ir(parseInt(v[0]),parseInt(v[1]));
}
function init(){
  for(let y=0;y<ROWS;y++){lab[y]=[];dot[y]=[];for(let x=0;x<COLS;x++){
    if(y==0||y==8||y==17||x==0||x==12) lab[y][x]=0; else if(x%2==1) lab[y][x]=1; else lab[y][x]=0; dot[y][x]=lab[y][x]==0;
  }}
}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v=new Set([sx+','+sy]);while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v.has(k)&&livre(nx,ny)){v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]})}}}return []}
function resize(){vw=cv.clientWidth;vh=cv.clientHeight;let dpr=devicePixelRatio||1;cv.width=vw*dpr;cv.height=vh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resize);
function updateCam(){let tX=px*W - vw/2 + W/2, tY=py*H - vh/2 + H/2; camX+=(tX-camX)*0.15; camY+=(tY-camY)*0.15; camX=Math.max(0,Math.min(camX,COLS*W-vw)); camY=Math.max(0,Math.min(camY,ROWS*H-vh));}
function draw(){
  updateCam(); ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh); ctx.save();ctx.translate(-camX,-camY);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(lab[y][x]==1){ctx.fillStyle='#1e40af';ctx.fillRect(x*W,y*H,W,H);ctx.fillStyle='#93c5fd';ctx.font='bold 10px Arial';ctx.fillText('B'+(x+1),x*W+4,y*H+15);}
    else if(dot[y][x]){ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(x*W+20,y*H+13,2.5,0,6.28);ctx.fill();}
  }
  ctx.fillStyle='#22c55e';ctx.fillRect(POS.ENTRADA.x*W-4,POS.ENTRADA.y*H-4,W+8,H+8);ctx.fillStyle='#000';ctx.font='bold 8px Arial';ctx.fillText('ENTRADA',POS.ENTRADA.x*W-2,POS.ENTRADA.y*H+4);ctx.fillText('DA LOJA',POS.ENTRADA.x*W-1,POS.ENTRADA.y*H+12);
  for(let i=0;i<rastro.length;i++){let p=rastro[i];let a=(i+1)/rastro.length;ctx.fillStyle=`rgba(34,197,94,${0.4+a*0.6})`;ctx.beginPath();ctx.arc(p.x*W+20,p.y*H+13,6*a+2,0,6.28);ctx.fill();}
  if(!(tx==POS.WAY.x&&ty==POS.WAY.y)){ctx.fillStyle='#ef4444';ctx.fillRect(tx*W-2,ty*H-2,W+4,H+4);}
  if(px==tx&&py==ty&&!(tx==POS.WAY.x&&ty==POS.WAY.y)){
    let bx=tx*W,by=ty*H,flagY=by+28,fx=bx-30; if(fx<camX) fx=camX+4; if(fx+130>camX+vw) fx=camX+vw-134;
    ctx.fillStyle='#facc15';ctx.fillRect(bx+18,by+22,4,60);ctx.fillStyle='#fff';ctx.fillRect(fx,flagY,130,56);ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.strokeRect(fx,flagY,130,56);
    ctx.fillStyle='#000';ctx.font='bold 10px Arial';ctx.fillText(produtoAtual,fx+6,flagY+16);
    try{
      let foto = IMGS[produtoAtual];
      if(foto && foto.complete && foto.naturalWidth>0){
        ctx.drawImage(foto,fx+78,flagY+4,48);
      }
    }catch(e){}
  }
  ctx.fillStyle='#facc15';ctx.shadowColor='#facc15';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(px*W+20,py*H+13,11,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.restore();
  document.getElementById('console').innerText=`V54 FOTO REAL | PRODUTO: ${produtoAtual}`;
}
function step(){if(cam.length==0){clearInterval(tm);tm=null;draw();return;}let p=cam.shift();rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=p.x;py=p.y;dot[py][px]=false;draw();}
function mover(dx,dy){if(tm){clearInterval(tm);tm=null;}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=nx;py=ny;dot[py][px]=false;draw();}
function ir(x,y){if(tm){clearInterval(tm);tm=null;}if(x==POS.WAY.x&&y==POS.WAY.y) rastro=[];tx=x;ty=y;cam=achar(px,py,x,y);if(cam.length==0){rastro.push({x:px,y:py});px=x;py=y;draw();return;}tm=setInterval(step,120);draw();}
function loop(){updateCam();draw();requestAnimationFrame(loop);}
init();resize();draw();loop();
</script>
</body>
</html>
