<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ATACADÃO 364 V15</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
body{display:flex;flex-direction:column}
#top{background:#facc15;color:#000;padding:2px;text-align:center;font-size:8px;font-weight:bold;flex-shrink:0}
#game{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#000;display:block;position:relative}
#map{display:grid;gap:1px;background:#222;padding:2px;border:1px solid #facc15;width:max-content}
.cell{width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-size:5px}
.wall{background:#1e40af}
.path{background:#000}
.gap{background:#111}
.corr{background:#111;outline:1px dashed #facc15}
.caixa{background:#fde68a;color:#000;font-weight:bold;font-size:4px}
.player{background:#facc15!important;border-radius:50%;border:1px solid #fff;box-shadow:0 0 4px #facc15;font-size:9px;z-index:10}
#bottom{flex-shrink:0;background:#111;border-top:1px solid #facc15;padding:3px}
#gps{font-size:7px;text-align:center;color:#22c55e;white-space:nowrap;overflow:hidden}
#controls{display:flex;justify-content:center;align-items:center;gap:4px;padding:3px}
#controls button{width:38px;height:32px;background:#222;color:#facc15;border:1px solid #facc15;border-radius:8px;font-size:14px}
#controls button:active{background:#facc15;color:#000}
#pos{font-size:6px;text-align:center;color:#999}
</style>
</head>
<body>
<div id="top">🛒 364 | 13 BAIAS 4x14 (7x2M) | GAP 3M + CORR 5M | ALT 2,5M | ARRASTA PRO LADO →</div>
<div id="game"><div id="map"></div></div>
<div id="bottom">
<div id="gps">📍 GPS OFF | ARRASTA O MAPA → PRA VER B1 ATÉ B13</div>
<div id="controls">
<button onclick="mover(-1,0)">←</button>
<button onclick="mover(0,-1)">↑</button>
<button onclick="mover(0,1)">↓</button>
<button onclick="mover(1,0)">→</button>
<button onclick="ativarGPS()" style="background:#22c55e;color:#000;width:48px;font-size:9px">📍GPS</button>
</div>
<div id="pos">X:1 Y:18 CAIXAS 0,0 | B1 B2 B3 B4 B5 B6 B7 B8 B9 B10 B11 B12 B13</div>
</div>
<script>
const COLS=40, ROWS=19; // 13 baias *3 = 39 +1
let px=1, py=18, gpsAtivo=false;
let lab=[];
for(let y=0;y<ROWS;y++){
 lab[y]=[];
 for(let x=0;x<COLS;x++){
  if(y==18) lab[y][x]=2;
  else if(y==17 || y==8) lab[y][x]=0;
  else {
    let baia=Math.floor(x/3); // 0 a 12 = 13 baias
    let pos= x % 3;
    lab[y][x]= (pos<2)?1:0; // 2 azul, 1 preto gap
  }
 }
}
function criar(){
const m=document.getElementById('map'); m.style.gridTemplateColumns=`repeat(${COLS},14px)`;
for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
 let c=document.createElement('div'); c.className='cell'; c.id=`c-${x}-${y}`;
 let v=lab[y][x];
 if(v==1){c.classList.add('wall'); if(y==0) c.innerText=`B${Math.floor(x/3)+1}`; c.style.fontSize='4px'; c.style.color='#fff';}
 else if(v==2){c.classList.add('caixa'); c.innerText='0,0';}
 else { if(y==8) c.classList.add('corr'); else c.classList.add('gap'); if(y==8 && x%3==1) c.innerText='5M'; }
 m.appendChild(c);
}
atualiza();
setTimeout(()=>{document.getElementById('game').scrollLeft=0;},100);
}
function atualiza(){
document.querySelectorAll('.player').forEach(e=>{e.classList.remove('player'); let id=e.id.split('-'); let x=parseInt(id[1]), y=parseInt(id[2]); if(e.classList.contains('caixa')) e.innerText='0,0'; else if(y==0 && e.classList.contains('wall')) e.innerText=`B${Math.floor(x/3)+1}`; else e.innerText=(y==8 && x%3==1)?'5M':'';});
let a=document.getElementById(`c-${px}-${py}`); a.classList.add('player'); a.innerText='🛒';
let b=Math.floor(px/3)+1;
document.getElementById('pos').innerText=`X:${px} Y:${py} BAIA B${b}/13 | ${py==18?'CAIXAS 0,0 ORIGEM':py==8?'CORREDOR 5M CENTRAL':py==17?'SAIDA CAIXAS':`GAP 3M ENTRE B${b} e B${b+1}`} | ALT 2.5M`;
if(!gpsAtivo) document.getElementById('gps').innerText=`📍 ARRASTA → PRA VER B1 ATÉ B13 | VOCÊ ESTÁ NA B${b} | X:${px} Y:${py}`;
let g=document.getElementById('game'); g.scrollLeft=(px*14)-50;
}
function mover(dx,dy){
let nx=px+dx, ny=py+dy; if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return;
let alvo=document.getElementById(`c-${nx}-${ny}`); if(alvo.classList.contains('wall')){ alvo.style.background='#ef4444'; setTimeout(()=>alvo.style.background='',100); return; }
px=nx; py=ny; atualiza();
}
function ativarGPS(){
if(!navigator.geolocation) return;
document.getElementById('gps').innerText='📍 Buscando... Permita';
navigator.geolocation.watchPosition(p=>{
 gpsAtivo=true;
 document.getElementById('gps').innerText=`📍 ${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)} ±${p.coords.accuracy.toFixed(0)}m B${Math.floor(px/3)+1}/13`;
},{},{enableHighAccuracy:true});
}
criar();
</script>
</body>
</html>
