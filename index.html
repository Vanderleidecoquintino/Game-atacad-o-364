<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>364 V23 BFS INTELIGENTE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#gps{background:#000;border-bottom:1px solid #22c55e;color:#22c55e;padding:5px;font-size:9px;text-align:center}
#game{flex:1;overflow:auto;background:#000}
#map{display:grid;gap:1px;background:#222;padding:2px;border:2px solid #facc15;width:max-content}
.cell{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:5px}
.wall{background:#1e40af}
.corr{background:#000}
.caminho{background:#facc15!important;opacity:0.6}
.caixa{background:#fde68a;color:#000;font-size:4px}
.meta{background:#ef4444!important;animation:piscar 0.5s infinite;color:#fff;font-weight:bold}
@keyframes piscar{0%,100%{opacity:1} 50%{opacity:0.4}}
.player{background:#22c55e!important;border-radius:50%;border:2px solid #fff;font-size:9px;z-index:10}
#bottom{background:#111;border-top:2px solid #facc15;padding:4px}
#controls{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
#controls button{height:32px;border-radius:7px;border:1px solid #facc15;font-size:9px;font-weight:bold;padding:0 6px}
.btnMove{width:36px;background:#222;color:#facc15;font-size:15px}
.btnMissao{background:#a855f7;color:#fff;width:75px}
.btnWay{background:#22c55e;color:#000;width:60px}
.btnStop{background:#ef4444;color:#fff;width:50px}
#pos{font-size:7px;text-align:center;color:#999;margin-top:3px}
</style>
</head>
<body>
<div id="gps">B6 X:15 Y:18 | BFS INTELIGENTE | MISSÃO 364 + WAY 1 NÃO TRAVA</div>
<div id="game"><div id="map"></div></div>
<div id="bottom">
<div id="controls">
<button class="btnMove" onclick="mover(-1,0)">←</button>
<button class="btnMove" onclick="mover(0,-1)">↑</button>
<button class="btnMove" onclick="mover(0,1)">↓</button>
<button class="btnMove" onclick="mover(1,0)">→</button>
<button class="btnMissao" onclick="missaoTang()">🎯 364</button>
<button class="btnWay" onclick="way1()">📦 WAY1</button>
<button class="btnStop" onclick="parar()">⏹️ STOP</button>
</div>
<div id="pos">VOLTA TOTAL LIBERADA CIMA+BAIXO+LAT+MEIO | BFS DESVIA SOZINHO</div>
</div>
<script>
const COLS=40, ROWS=19; let px=15,py=18, tx=null, ty=null, caminho=[], auto=null;
let lab=[];
for(let y=0;y<ROWS;y++){
 lab[y]=[];
 for(let x=0;x<COLS;x++){
  if(y==18 && x>=14 && x<=26) lab[y][x]=2;
  else if(y==0||y==17||y==8||x==0||x==COLS-1) lab[y][x]=0;
  else lab[y][x]=(x%3<2)?1:0;
 }
}
function criar(){
 const m=document.getElementById('map'); m.style.gridTemplateColumns=`repeat(${COLS},16px)`;
 for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
  let c=document.createElement('div'); c.className='cell'; c.id=`c-${x}-${y}`;
  let v=lab[y][x]; if(v==1){c.classList.add('wall'); if(y==1) c.innerText=`B${Math.floor(x/3)+1}`; c.style.color='#fff';}
  else if(v==2){c.classList.add('caixa'); c.innerText='0,0';}
  else c.classList.add('corr');
  m.appendChild(c);
 } atualiza();
}
function atualiza(){
 document.querySelectorAll('.player').forEach(e=>{e.classList.remove('player'); if(e.classList.contains('caixa')) e.innerText='0,0'; else if(e.classList.contains('wall')){} else if(!e.classList.contains('meta') &&!e.classList.contains('caminho')) e.innerText='';});
 document.getElementById(`c-${px}-${py}`).classList.add('player'); document.getElementById(`c-${px}-${py}`).innerText='🛒';
 let b=Math.floor(px/3)+1; document.getElementById('gps').innerText=`B${b} X:${px} Y:${py} ${caminho.length?`| 🎯 ${caminho.length} passos até X:${tx} Y:${ty} - ${auto?'AUTO BFS':''}`:'| MANUAL'} | VOLTA TOTAL`;
 document.getElementById('game').scrollLeft=(px*16)-80;
 if(px==tx && py==ty && tx!=null){ parar(); document.getElementById('gps').innerText=`✅ CHEGOU META B${b} X:${px} Y:${py} | MISSÃO CUMPRIDA`; navigator.vibrate&&navigator.vibrate([200,100,200]); }
}
function mover(dx,dy){
 let nx=px+dx, ny=py+dy; if(!livre(nx,ny)) return; px=nx; py=ny; atualiza();
}
function livre(x,y){ if(x<0||x>=COLS||y<0||y>=ROWS) return false; let el=document.getElementById(`c-${x}-${y}`); return el &&!el.classList.contains('wall'); }
function parar(){ if(auto) clearInterval(auto); auto=null; caminho=[]; tx=null; ty=null; document.querySelectorAll('.meta').forEach(e=>e.classList.remove('meta')); document.querySelectorAll('.caminho').forEach(e=>e.classList.remove('caminho')); }

// BFS QUE NÃO BATE NO CORREDOR
function acharCaminho(sx,sy, ex,ey){
 let fila=[{x:sx,y:sy,path:[]}]; let visit=new Set([`${sx},${sy}`]);
 let dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 while(fila.length){
  let cur=fila.shift();
  if(cur.x==ex && cur.y==ey) return cur.path;
  for(let [dx,dy] of dirs){
   let nx=cur.x+dx, ny=cur.y+dy;
   let key=`${nx},${ny}`;
   if(!visit.has(key) && livre(nx,ny)){
    visit.add(key);
    fila.push({x:nx,y:ny,path:[...cur.path,{x:nx,y:ny}]});
   }
  }
 }
 return null;
}
function irPara(x,y){
 parar();
 if(!livre(x,y)){ document.getElementById('gps').innerText=`❌ POS X:${x} Y:${y} BLOQUEADA - É PAREDE`; return; }
 tx=x; ty=y;
 let rota=acharCaminho(px,py,tx,ty);
 if(!rota){ document.getElementById('gps').innerText=`❌ SEM CAMINHO PRA X:${x} Y:${y} - VOLTA TOTAL BLOQUEADA?`; return; }
 caminho=rota;
 document.getElementById(`c-${tx}-${ty}`).classList.add('meta');
 document.getElementById(`c-${tx}-${ty}`).innerText= tx==38?'364':'W1';
 // mostra caminho amarelo
 caminho.forEach(p=>{ if(!(p.x==tx&&p.y==ty)) document.getElementById(`c-${p.x}-${p.y}`).classList.add('caminho'); });
 auto=setInterval(()=>{ if(caminho.length==0){ parar(); return; } let prox=caminho.shift(); px=prox.x; py=prox.y; // limpa rastro atras
  document.querySelectorAll('.caminho').forEach(e=>e.classList.remove('caminho')); caminho.forEach(p=>document.getElementById(`c-${p.x}-${p.y}`).classList.add('caminho'));
  atualiza();
 },160);
}
function missaoTang(){ irPara(38,1); } // POS 364 B13 topo dir - corredor lateral
function way1(){ irPara(3,15); } // WAY 1 B1 baixo esq - corredor lateral

criar();
</script>
</body>
</html>
