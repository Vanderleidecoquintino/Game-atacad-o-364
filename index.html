<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V55.3 DIV - SEMPRE FUNCIONA</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:5px}
#mapa{width:100%;height:300px;background:#111;border:2px solid yellow;position:relative;overflow:hidden}
.gondola{position:absolute;background:#1e40af;border:1px solid yellow;color:yellow;font-size:8px;display:flex;align-items:center;justify-content:center}
.player{position:absolute;width:14px;height:14px;background:yellow;border-radius:50%;border:2px solid #fff;z-index:10;transition:all 0.1s}
.pin{position:absolute;width:18px;height:18px;background:red;border-radius:50%;color:#fff;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:5}
.rota{position:absolute;height:3px;background:#0f0;transform-origin:0 0;z-index:2}
button{width:100%;padding:12px;margin-top:5px;background:#22c55e;border:2px solid yellow;border-radius:8px;font-weight:bold;font-size:14px}
select{width:100%;padding:10px;margin-top:5px}
#log{background:#222;color:#0f0;padding:5px;font-size:11px;min-height:40px;margin-top:5px}
</style>
</head>
<body>
<h3 style="color:yellow;text-align:center">V55.3 - LISTA INTELIGENTE - DIV</h3>
<div id="mapa"></div>
<div id="log">Carregando...</div>

<select id="combo">
<option value="10,20">🍚 ARROZ [25-26]</option>
<option value="150,20">🥛 LEITE [11-12]</option>
<option value="80,150">🥩 CARNE [17-18]</option>
<option value="10,150">🍞 PAO [25-26]</option>
<option value="200,20">💧 AGUA [3-4]</option>
<option value="200,150">🍌 BANANA [3-4]</option>
</select>

<button onclick="add()">+ ADICIONAR NA LISTA</button>
<button onclick="gerar()" style="background:yellow">🗺️ GERAR ROTA MAIS RÁPIDA</button>
<button onclick="limpar()" style="background:#333;color:#fff">LIMPAR</button>

<div id="lista" style="background:#111;padding:8px;margin-top:5px;font-size:12px"></div>

<script>
let lista=[];
let player={x:250,y:260};

function desenharMapa(){
 let m=document.getElementById('mapa');
 m.innerHTML='';
 // 6 gondolas
 let gonds=[{x:0,y:10,w:80,h:20,t:'25-26'},{x:100,y:10,w:80,h:20,t:'11-12'},{x:200,y:10,w:80,h:20,t:'3-4'},{x:0,y:120,w:80,h:20,t:'25-26'},{x:100,y:120,w:80,h:20,t:'17-18'},{x:200,y:120,w:80,h:20,t:'3-4'}];
 gonds.forEach(g=>{
   let d=document.createElement('div');d.className='gondola';
   d.style.left=g.x+'px';d.style.top=g.y+'px';d.style.width=g.w+'px';d.style.height=g.h+'px';
   d.innerText=g.t; m.appendChild(d);
 });
 // entrada
 let e=document.createElement('div');e.style.position='absolute';e.style.left='240px';e.style.top='250px';e.style.width='40px';e.style.height='20px';e.style.background='#0f0';e.style.color='#000';e.style.fontSize='8px';e.innerText='ENTRADA';m.appendChild(e);

 // player
 let p=document.createElement('div');p.className='player';p.id='player';
 p.style.left=player.x+'px';p.style.top=player.y+'px';m.appendChild(p);

 // pins lista
 lista.forEach((it,i)=>{
   let pin=document.createElement('div');pin.className='pin';
   pin.style.left=it.x+'px';pin.style.top=it.y+'px';
   pin.innerText=i+1; m.appendChild(pin);
 });
 document.getElementById('log').innerText='Mapa OK - '+lista.length+' itens - Player em '+player.x+','+player.y;
}

function add(){
 let sel=document.getElementById('combo');
 let v=sel.value.split(','); let x=parseInt(v[0]),y=parseInt(v[1]);
 let txt=sel.options[sel.selectedIndex].text;
 if(lista.find(l=>l.x==x&&l.y==y)){alert('Já na lista');return;}
 lista.push({x,y,txt});
 document.getElementById('lista').innerHTML+= (lista.length)+'. '+txt+'<br>';
 desenharMapa();
}

function limpar(){lista=[];document.getElementById('lista').innerHTML='';desenharMapa();}

function gerar(){
 if(lista.length==0){alert('Adicione itens');return;}
 // ordena por distância da entrada
 let atual={x:250,y:260};
 let ordem=[];
 let resto=[...lista];
 let caminho=[];
 while(resto.length){
   resto.sort((a,b)=>(Math.abs(atual.x-a.x)+Math.abs(atual.y-a.y)) - (Math.abs(atual.x-b.x)+Math.abs(atual.y-b.y)));
   let prox=resto.shift();
   ordem.push(prox);
   atual=prox;
 }
 lista=ordem;
 document.getElementById('lista').innerHTML='ROTA OTIMIZADA:<br>'+ordem.map((o,i)=> (i+1)+'. '+o.txt).join('<br>');
 desenharMapa();
 // animar player
 let idx=0;
 let interval=setInterval(()=>{
   if(idx>=ordem.length){clearInterval(interval);document.getElementById('log').innerText='✅ CHEGOU - ROTA CONCLUÍDA - '+ordem.length+' itens';return;}
   let dest=ordem[idx];
   player.x=dest.x; player.y=dest.y;
   desenharMapa();
   idx++;
 },600);
}

desenharMapa();
</script>
</body>
</html>
