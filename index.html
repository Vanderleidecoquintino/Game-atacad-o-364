<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ATACADÃO 364</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#gps{background:#facc15;color:#000;padding:8px;text-align:center;font-size:12px;font-weight:bold}
#helpBtn{position:absolute;top:36px;right:10px;z-index:900;background:#facc15;color:#000;border:none;width:38px;height:38px;border-radius:50%;font-weight:bold;font-size:20px}
canvas{flex:1;width:100%;background:#111;border:3px solid #facc15;touch-action:none}
.btns{display:grid;grid-template-columns:repeat(4,1fr) 1.5fr 1fr;gap:6px;padding:8px;background:#0a0a0a}
button{height:54px;border-radius:12px;border:2px solid #facc15;font-weight:bold}
.bm{background:#222;color:#facc15;font-size:20px}
#combo{height:54px;border-radius:12px;border:2px solid #facc15;background:#fff;color:#000;font-weight:bold;font-size:14px;padding:0 8px;width:100%}
#votoBox{background:#111;padding:8px;display:flex;gap:6px;align-items:center;border-top:2px solid #facc15}
#ofertaBox{display:none;background:#22c55e;color:#000;padding:12px;border-radius:12px;margin:8px;position:absolute;bottom:80px;left:8px;right:8px;z-index:800}
</style>
</head>
<body>
<div id="gps">🛒 ATACADÃO 364 - V56.2</div>
<button id="helpBtn" onclick="abrirHelp()">?</button>

<div id="help" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;padding:16px">
  <div style="background:#111;border:3px solid #facc15;border-radius:16px;padding:18px;max-width:330px;width:100%">
    <h3 style="color:#facc15;margin-bottom:12px;text-align:center">🛒 COMO USAR</h3>
    <div style="font-size:13px;line-height:1.8">
      <p>➡️ <b>Setas:</b> anda</p>
      <p>📦 <b>Produto:</b> vai sozinho</p>
      <p>⭐ <b>Vota</b> e 🔔 <b>Oferta</b></p>
      <p>🟢 <b>ENTRADA:</b> volta</p>
    </div>
    <button onclick="fecharHelp()" style="width:100%;margin-top:14px;background:#facc15;color:#000;border:none;padding:14px;border-radius:10px;font-weight:bold">BORA! 🚀</button>
  </div>
</div>

<canvas id="c"></canvas>

<div id="votoBox">
  <span id="pNome" style="font-size:11px;font-weight:bold">TANG 364</span>
  <button onclick="votar(1)">⭐</button><button onclick="votar(3)">⭐⭐⭐</button><button onclick="votar(5)">⭐⭐⭐⭐⭐</button>
  <span id="msg" style="font-size:10px;color:#22c55e"></span>
</div>

<div id="ofertaBox">
  <b>Oferta de <span id="prodOferta"></span>?</b><br>
  <input id="zap" placeholder="Seu zap" style="width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none">
  <button onclick="pedirOferta()" style="background:#000;color:#22c55e;width:100%;padding:12px;border-radius:8px">ME AVISA 🔔</button>
  <button onclick="document.getElementById('ofertaBox').style.display='none'" style="background:none;border:none;font-size:11px;margin-top:6px;width:100%">agora não</button>
</div>

<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<select id="combo" onchange="trocarProduto()"></select>
<button class="bm" onclick="ir(6,18)" style="background:#22c55e;color:#000">ENTRADA</button>
</div>

<script>
function abrirHelp(){document.getElementById('help').style.display='flex';}
function fecharHelp(){document.getElementById('help').style.display='none';}
const COLS=13,ROWS=19,W=40,H=26;
let lab=[],dot=[],px=6,py=18,tx=6,ty=18,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0,produtoAtual="TANG 364";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const PRODUTOS=[
 {nome:"TANG 364",x:2,y:2},{nome:"ARROZ 5KG",x:4,y:2},{nome:"FEIJÃO",x:6,y:2},{nome:"ÓLEO",x:8,y:2},
 {nome:"BISCOITO",x:10,y:2},{nome:"REFRI 2L",x:2,y:5},{nome:"LIMPEZA",x:4,y:5},{nome:"HIGIENE",x:6,y:5},
 {nome:"FRIOS",x:8,y:5},{nome:"PADARIA",x:10,y:5},{nome:"CARNES",x:2,y:12},{nome:"FRUTAS",x:4,y:12},
 {nome:"BEBIDAS",x:6,y:12},{nome:"RAÇÃO",x:8,y:12},{nome:"LEITE",x:10,y:12}
];
function init(){
 let combo=document.getElementById('combo'); PRODUTOS.forEach(p=>{let o=document.createElement('option');o.value=p.x+","+p.y;o.textContent=p.nome;combo.appendChild(o);});
 for(let y=0;y<ROWS;y++){lab[y]=[];dot[y]=[];for(let x=0;x<COLS;x++){lab[y][x]=0; if(y!=0&&y!=18&&y!=9&&x!=0&&x!=12&&x!=6){if(x%2==1&&y%2==1)lab[y][x]=1;} dot[y][x]=lab[y][x]==0;}}
 resize(); draw(); loop();
}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]==0;}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v=new Set([sx+','+sy]);while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v.has(k)&&livre(nx,ny)){v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]})}}}return [];}
function resize(){vw=cv.clientWidth;vh=cv.clientHeight;let dpr=window.devicePixelRatio||1;cv.width=vw*dpr;cv.height=vh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resize);
function updateCam(){let tX=px*W-vw/2+W/2,tY=py*H-vh/2+H/2;camX+=(tX-camX)*0.15;camY+=(tY-camY)*0.15;camX=Math.max(0,Math.min(camX,COLS*W-vw));camY=Math.max(0,Math.min(camY,ROWS*H-vh));}
function draw(){updateCam();ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(-camX,-camY);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(lab[y][x]==1){ctx.fillStyle='#222';ctx.fillRect(x*W,y*H,W,H);}else if(dot[y]&&dot[y][x]){ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(x*W+20,y*H+13,2,0,6.28);ctx.fill();}}for(let i=0;i<rastro.length;i++){let p=rastro[i];let a=(i+1)/rastro.length;ctx.fillStyle='rgba(34,197,94,'+(0.3+a*0.6)+')';ctx.beginPath();ctx.arc(p.x*W+20,p.y*H+13,4*a+2,0,6.28);ctx.fill();}if(!(tx==6&&ty==18)){ctx.fillStyle='#ef4444';ctx.fillRect(tx*W-2,ty*H-2,W+4,H+4);}if(px==tx&&py==ty&&!(tx==6&&ty==18)){let bx=tx*W,by=ty*H,flagY=by+28,fx=bx-30;if(fx<camX)fx=camX+4;if(fx+130>camX+vw)fx=camX+vw-134;ctx.fillStyle='#facc15';ctx.fillRect(bx+18,by+22,4,50);ctx.fillStyle='#fff';ctx.fillRect(fx,flagY,120,40);ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.strokeRect(fx,flagY,120,40);ctx.fillStyle='#000';ctx.font='bold 10px Arial';ctx.fillText(produtoAtual,fx+6,flagY+24);}ctx.fillStyle='#facc15';ctx.shadowColor='#facc15';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(px*W+20,py*H+13,10,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore();}
function step(){if(cam.length==0){clearInterval(tm);tm=null;return;}let p=cam.shift();rastro.push({x:px,y:py});if(rastro.length>15)rastro.shift();px=p.x;py=p.y;if(dot[py])dot[py][px]=false;}
function mover(dx,dy){if(tm){clearInterval(tm);tm=null;}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;rastro.push({x:px,y:py});if(rastro.length>15)rastro.shift();px=nx;py=ny;if(dot[py])dot[py][px]=false;}
function ir(x,y){if(tm){clearInterval(tm);tm=null;}if(x==6&&y==18)rastro=[];tx=x;ty=y;cam=achar(px,py,x,y);if(cam.length==0){px=x;py=y;return;}tm=setInterval(step,110);}
function trocarProduto(){let sel=document.getElementById('combo');let v=sel.value.split(',');produtoAtual=sel.options[sel.selectedIndex].text;document.getElementById('pNome').innerText=produtoAtual;ir(parseInt(v[0]),parseInt(v[1]));}
function votar(nota){document.getElementById('msg').innerText='⭐'+nota+' salvo!';document.getElementById('prodOferta').innerText=produtoAtual;document.getElementById('ofertaBox').style.display='block';}
function pedirOferta(){let zap=document.getElementById('zap').value;alert('Salvo! Oferta de '+produtoAtual+' pro zap '+zap);document.getElementById('ofertaBox').style.display='none';}
function loop(){updateCam();draw();requestAnimationFrame(loop);}
init();
</script>
</body>
</html>
