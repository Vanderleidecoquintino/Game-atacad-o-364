<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>364 V22 MISSÃO TANG WAY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#gps{background:#000;border-bottom:1px solid #22c55e;color:#22c55e;padding:5px;font-size:9px;text-align:center}
#game{flex:1;overflow:auto;background:#000}
#map{display:grid;gap:1px;background:#222;padding:2px;border:2px solid #facc15;width:max-content}
.cell{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:5px}
.wall{background:#1e40af}
.corr{background:#000}
.caixa{background:#fde68a;color:#000;font-size:4px}
.meta{background:#ef4444!important;animation:piscar 0.6s infinite}
@keyframes piscar{0%,100%{opacity:1} 50%{opacity:0.3}}
.player{background:#facc15!important;border-radius:50%;border:2px solid #fff;font-size:9px;z-index:10}
#bottom{background:#111;border-top:2px solid #facc15;padding:4px}
#controls{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
#controls button{height:32px;border-radius:7px;border:1px solid #facc15;font-size:9px;font-weight:bold;padding:0 6px}
.btnMove{width:38px;background:#222;color:#facc15;font-size:16px}
.btnMissao{background:#a855f7;color:#fff;width:75px}
.btnWay{background:#22c55e;color:#000;width:60px}
.btnGps{background:#22c55e;color:#000;width:50px}
#pos{font-size:7px;text-align:center;color:#999;margin-top:3px}
</style>
</head>
<body>
<div id="gps">B6 X:15 Y:18 | VOLTA TOTAL | MISSÃO TANG 364 + WAY 1 | TOQUE MISSÃO</div>
<div id="game"><div id="map"></div></div>
<div id="bottom">
<div id="controls">
<button class="btnMove" onclick="mover(-1,0)">←</button>
<button class="btnMove" onclick="mover(0,-1)">↑</button>
<button class="btnMove" onclick="mover(0,1)">↓</button>
<button class="btnMove" onclick="mover(1,0)">→</button>
<button class="btnMissao" onclick="missaoTang()">🎯 MISSÃO 364</button>
<button class="btnWay" onclick="way1()">📦 WAY 1</button>
<button class="btnGps" onclick="ativarGPS()">📍GPS</button>
</div>
<div id="pos">364 POSIÇÕES | VOLTA TOTAL CIMA+BAIXO+LAT+MEIO | CAIXAS 0,0</div>
</div>
<script>
const COLS=40, ROWS=19; let px=15,py=18, tx=null, ty=null, auto=null;
let lab=[];
for(let y=0;y<ROWS;y++){
 lab[y]=[];
 for(let x=0;x<COLS;x++){
  if(y==18 && x>=14 && x<=26) lab[y][x]=2;
  else if(y==0||y==17||y==8||x==0||x==COLS-1) lab[y][x]=0;
  else lab[y][x]=(x%3<2)?1:0;
 }
}
function criar(){
 const m=document.getElementById('map'); m.style.gridTemplateColumns=`repeat(${COLS},16px)`;
 for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
  let c=document.createElement('div'); c.className='cell'; c.id=`c-${x}-${y}`;
  let v=lab[y][x]; if(v==1){c.classList.add('wall'); if(y==1) c.innerText=`B${Math.floor(x/3)+1}`; c.style.color='#fff'; c.style.fontSize='4px';}
  else if(v==2){c.classList.add('caixa'); c.innerText='0,0';}
  else c.classList.add('corr');
  m.appendChild(c);
 } atualiza();
}
function atualiza(){
 document.querySelectorAll('.player').forEach(e=>{e.classList.remove('player'); if(e.classList.contains('caixa')) e.innerText='0,0'; else if(e.classList.contains('wall')){} else e.innerText='';});
 document.getElementById(`c-${px}-${py}`).classList.add('player'); document.getElementById(`c-${px}-${py}`).innerText='🛒';
 let b=Math.floor(px/3)+1; document.getElementById('gps').innerText=`B${b} X:${px} Y:${py} ${tx!=null?`| 🎯 INDO PRA X:${tx} Y:${ty}`:'| VOLTA TOTAL'} | ${auto?'AUTO ON':'MANUAL'} | ${Math.floor(px/3)+ (py*13)} /364`;
 document.getElementById('game').scrollLeft=(px*16)-80;
 if(px==tx && py==ty && tx!=null){ clearInterval(auto); auto=null; tx=null; ty=null; document.querySelectorAll('.meta').forEach(e=>e.classList.remove('meta')); document.getElementById('gps').innerText=`✅ META CHEGOU B${b} X:${px} Y:${py} | MISSÃO CUMPRIDA`; navigator.vibrate&&navigator.vibrate([100,50,100]); }
}
function mover(dx,dy){
 let nx=px+dx, ny=py+dy; if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return;
 if(document.getElementById(`c-${nx}-${ny}`).classList.contains('wall')) return;
 px=nx; py=ny; atualiza();
}
function missaoTang(){
 // POS 364 = última baia B13 lá no fundo X=38 Y=1 (topo direito)
 if(auto) clearInterval(auto);
 document.querySelectorAll('.meta').forEach(e=>e.classList.remove('meta'));
 tx=38; ty=1; // POS 364 = B13 topo
 document.getElementById(`c-${tx}-${ty}`).classList.add('meta');
 document.getElementById(`c-${tx}-${ty}`).innerText='364';
 document.getElementById('gps').innerText=`🎯 MISSÃO TANG ATIVADA POS 364 B13 X:${tx} Y:${ty} - INDO BUSCAR...`;
 auto=setInterval(()=>passoAuto(),180);
}
function way1(){
 // WAY POS 1 = B1 perto das caixas X=3 Y=15 (início)
 if(auto) clearInterval(auto);
 document.querySelectorAll('.meta').forEach(e=>e.classList.remove('meta'));
 tx=3; ty=15; // POS 1 = B1 baixo
 document.getElementById(`c-${tx}-${ty}`).classList.add('meta');
 document.getElementById(`c-${tx}-${ty}`).innerText='WAY1';
 document.getElementById('gps').innerText=`📦 WAY POS 1 ATIVADO B1 X:${tx} Y:${ty} - INDO BUSCAR...`;
 auto=setInterval(()=>passoAuto(),180);
}
function passoAuto(){
 if(tx==null) return;
 let dx=Math.sign(tx-px); let dy=Math.sign(ty-py);
 // tenta ir pro alvo desviando parede
 if(dx!=0 && pode(px+dx,py)){ mover(dx,0); return; }
 if(dy!=0 && pode(px,py+dy)){ mover(0,dy); return; }
 // se bloqueado, tenta volta
 if(pode(px+1,py)) mover(1,0);
 else if(pode(px-1,py)) mover(-1,0);
 else if(pode(px,py+1)) mover(0,1);
 else if(pode(px,py-1)) mover(0,-1);
}
function pode(x,y){ if(x<0||x>=COLS||y<0||y>=ROWS) return false; return!document.getElementById(`c-${x}-${y}`).classList.contains('wall'); }
function ativarGPS(){
 if(!navigator.geolocation) return;
 document.getElementById('gps').innerText='Buscando GPS...';
 navigator.geolocation.getCurrentPosition(p=>{ document.getElementById('gps').innerText=`📍 ${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)} | B${Math.floor(px/3)+1} | ${tx!=null?'🎯 AUTO':''}`; },{},{enableHighAccuracy:true});
}
criar();
</script>
</body>
</html>
