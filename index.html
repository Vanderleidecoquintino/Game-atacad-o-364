<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ATACADÃO 364 - V57</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#gps{background:#facc15;color:#000;padding:8px;text-align:center;font-size:12px;font-weight:bold;letter-spacing:1px}
#helpBtn{position:absolute;top:36px;right:10px;z-index:900;background:#facc15;color:#000;border:none;width:38px;height:38px;border-radius:50%;font-weight:bold;font-size:20px;box-shadow:0 0 10px #facc15}
canvas{flex:1;width:100%;background:#050a1e;border:3px solid #facc15;touch-action:none}
.btns{display:grid;grid-template-columns:repeat(4,50px) 1fr 90px;gap:5px;padding:6px;background:#0a0a0a;align-items:center}
button{height:48px;border-radius:10px;border:2px solid #facc15;font-weight:bold}
.bm{background:#1a1a1a;color:#facc15;font-size:18px}
#combo{height:48px;border-radius:10px;border:2px solid #facc15;background:#fff;color:#000;font-weight:bold;font-size:13px;padding:0 6px;width:100%}
#votoBox{background:#111;padding:6px 8px;display:flex;gap:6px;align-items:center;border-top:2px solid #facc15}
#ofertaBox{display:none;background:#22c55e;color:#000;padding:12px;border-radius:12px;margin:8px;position:absolute;bottom:75px;left:8px;right:8px;z-index:800}
</style>
</head>
<body>
<div id="gps">🛒 ATACADÃO 364 - V57 AZUL</div>
<button id="helpBtn" onclick="abrirHelp()">?</button>

<div id="help" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;padding:16px">
  <div style="background:#111;border:3px solid #facc15;border-radius:16px;padding:18px;max-width:330px;width:100%">
    <h3 style="color:#facc15;margin-bottom:12px;text-align:center">🛒 V57</h3>
    <div style="font-size:13px;line-height:1.8"><p>Motor V56.2 + Tela V54 azul</p></div>
    <button onclick="fecharHelp()" style="width:100%;margin-top:14px;background:#facc15;color:#000;border:none;padding:14px;border-radius:10px;font-weight:bold">BORA! 🚀</button>
  </div>
</div>

<canvas id="c"></canvas>

<div id="votoBox">
  <span id="pNome" style="font-size:11px;font-weight:bold;min-width:70px">TANG 364</span>
  <button onclick="votar(1)" style="height:32px;padding:0 8px">⭐</button>
  <button onclick="votar(3)" style="height:32px;padding:0 8px">⭐⭐⭐</button>
  <button onclick="votar(5)" style="height:32px;padding:0 8px">⭐⭐⭐⭐⭐</button>
  <span id="msg" style="font-size:10px;color:#22c55e"></span>
</div>

<div id="ofertaBox">
  <b>Oferta <span id="prodOferta"></span>?</b><br>
  <input id="zap" placeholder="Seu zap" style="width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none">
  <button onclick="pedirOferta()" style="background:#000;color:#22c55e;width:100%;padding:12px;border-radius:8px;border:none;font-weight:bold">ME AVISA 🔔</button>
  <button onclick="document.getElementById('ofertaBox').style.display='none'" style="background:none;border:none;font-size:11px;margin-top:6px;width:100%">agora não</button>
</div>

<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<select id="combo" onchange="trocarProduto()"></select>
<button class="bm" onclick="ir(6,18)" style="background:#22c55e;color:#000;border-color:#22c55e">ENTRADA</button>
</div>

   dot[y][x]=lab[y][x]==0;
 }}
 resize(); draw(); loop();
}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]==0;}
