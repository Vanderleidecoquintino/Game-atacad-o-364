<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V54.1 - 31 CAIXAS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#gps{background:#facc15;color:#000;padding:8px;text-align:center;font-size:11px;font-weight:bold;cursor:pointer}
#console{background:#111;color:#22c55e;padding:5px;font-family:monospace;font-size:9px;white-space:pre;line-height:11px;max-height:60px;overflow:auto;border-bottom:2px solid #facc15}
canvas{flex:1;width:100%;background:#000;border:3px solid #facc15;touch-action:none;display:block;min-height:400px}
.btns{display:grid;grid-template-columns:repeat(4,1fr) 1.5fr 1fr;gap:6px;padding:8px;background:#0a0a0a}
button{height:54px;border-radius:12px;border:2px solid #facc15;font-weight:bold}
.bm{background:#222;color:#facc15;font-size:20px}
.bway{background:#22c55e;color:#000;font-size:11px}
#combo{height:54px;border-radius:12px;border:2px solid #facc15;background:#fff;color:#000;font-weight:bold;font-size:14px;padding:0 8px;width:100%}
#caixaInfo{display:none;position:absolute;bottom:80px;left:8px;right:8px;background:#fff;color:#000;border-radius:16px;padding:12px;border:3px solid #facc15;z-index:900}
</style>
</head>
<body>
<div id="gps" onclick="GPS.iniciar()">📍 V54.1 - 31 CAIXAS - CLICA PRA GPS</div>
<div id="console"></div>
<canvas id="c"></canvas>

<div id="caixaInfo">
<div style="display:flex;justify-content:space-between;align-items:center">
<b id="cProd" style="font-size:14px">TANG 364</b><b id="cPreco" style="color:#16a34a;font-size:18px">R$ 1,49</b>
</div>
<div id="cCaixa" style="background:#1e40af;color:#fff;padding:8px;border-radius:8px;margin:8px 0;text-align:center;font-weight:bold;font-size:13px"></div>
<div id="cFila" style="font-size:11px;color:#666"></div>
<button onclick="document.getElementById('caixaInfo').style.display='none'" style="width:100%;margin-top:8px;background:#facc15;color:#000;border:none;padding:10px;border-radius:8px;font-weight:bold">FECHAR</button>
</div>

<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<select id="combo" onchange="trocarProduto()">
<option value="10,1">TANG 364 - R$1,49</option>
<option value="2,2">ARROZ - R$22,90</option>
<option value="4,2">FEIJÃO - R$8,99</option>
<option value="6,2">ÓLEO - R$7,49</option>
<option value="8,2">BISCOITO - R$3,99</option>
<option value="2,5">REFRI - R$8,99</option>
<option value="4,5">LIMPEZA - R$12,90</option>
<option value="6,5">HIGIENE - R$15,90</option>
<option value="8,5">FRIOS - R$29,90</option>
<option value="2,10">PADARIA - R$6,90</option>
<option value="4,10">CARNES - R$39,90</option>
<option value="6,10">FRUTAS - R$9,90</option>
<option value="8,10">BEBIDAS - R$4,99</option>
<option value="10,10">RAÇÃO - R$89,90</option>
</select>
<button class="bway" onclick="ir(POS.WAY.x,POS.WAY.y)">ENTRADA</button>
</div>
<script>
const COLS=13,ROWS=19,W=40,H=26;
const POS={TANG:{x:10,y:1},WAY:{x:12,y:15},ENTRADA:{x:12,y:15}};
let lab=[],dot=[],px=12,py=15,tx=12,ty=15,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0;
let produtoAtual="TANG 364";
// 31 CAIXAS - BALANCEAMENTO
let caixas=Array.from({length:31},(_,i)=>({id:i+1,fila:Math.floor(Math.random()*4)}));
let precos={"TANG 364":"R$ 1,49","ARROZ":"R$ 22,90","FEIJÃO":"R$ 8,99","ÓLEO":"R$ 7,49","BISCOITO":"R$ 3,99","REFRI":"R$ 8,99","LIMPEZA":"R$ 12,90","HIGIENE":"R$ 15,90","FRIOS":"R$ 29,90","PADARIA":"R$ 6,90","CARNES":"R$ 39,90","FRUTAS":"R$ 9,90","BEBIDAS":"R$ 4,99","RAÇÃO":"R$ 89,90"};
function pegaCaixaLivre(){caixas.sort((a,b)=>a.fila-b.fila);let c=caixas[0];c.fila++;setTimeout(()=>{c.fila=Math.max(0,c.fila-1)},20000);return c;}
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const tangImg=new Image();tangImg.src='IMG-20260926-WA7510.jpg';
const GPS={lat:null,lng:null,ativo:false,iniciar(){if(!navigator.geolocation){document.getElementById('gps').innerText='GPS NÃO SUPORTADO';return;}document.getElementById('gps').innerText='🔍 BUSCANDO GPS...';navigator.geolocation.watchPosition(p=>{this.lat=p.coords.latitude;this.lng=p.coords.longitude;this.ativo=true;document.getElementById('gps').style.background='#22c55e';document.getElementById('gps').innerText=`🟢 GPS ON | V54.1 31 CAIXAS`;},e=>{document.getElementById('gps').style.background='#ef4444';document.getElementById('gps').innerText=`🔴 GPS ERRO: ${e.message}`},{enableHighAccuracy:true,maximumAge:0,timeout:10000});}};
function trocarProduto(){let sel=document.getElementById('combo');let v=sel.value.split(',');produtoAtual=sel.options[sel.selectedIndex].text.split(' - ')[0];ir(parseInt(v[0]),parseInt(v[1]));}
function init(){for(let y=0;y<ROWS;y++){lab[y]=[];dot[y]=[];for(let x=0;x<COLS;x++){if(y==0||y==8||y==17||x==0||x==12) lab[y][x]=0; else if(x%2==1) lab[y][x]=1; else lab[y][x]=0; dot[y][x]=lab[y][x]==0;}}let s=localStorage.getItem('v54_pos'); if(s){try{let p=JSON.parse(s);px=p.px;py=p.py;}catch(e){}}}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v=new Set([sx+','+sy]);while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v.has(k)&&livre(nx,ny)){v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]})}}}return []}
function resize(){let rect=cv.getBoundingClientRect();vw=rect.width||window.innerWidth;vh=rect.height||400;if(vh<300) vh=400;let dpr=window.devicePixelRatio||1;cv.width=vw*dpr;cv.height=vh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',()=>{resize();draw();});
function updateCam(){let tX=px*W - vw/2 + W/2, tY=py*H - vh/2 + H/2; camX+=(tX-camX)*0.15; camY+=(tY-camY)*0.15;let maxX=Math.max(0,COLS*W-vw);let maxY=Math.max(0,ROWS*H-vh);camX=Math.max(0,Math.min(camX,maxX));camY=Math.max(0,Math.min(camY,maxY));}
function draw(){updateCam();ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(-camX,-camY);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(lab[y][x]==1){ctx.fillStyle='#0a194e';ctx.fillRect(x*W,y*H,W,H);ctx.fillStyle='#1e40af';ctx.fillRect(x*W+1,y*H+1,W-2,H-2);ctx.fillStyle='#93c5fd';ctx.font='bold 10px Arial';ctx.fillText('B'+(x+1),x*W+4,y*H+15);}else if(dot[y][x]){ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(x*W+20,y*H+13,2.5,0,6.28);ctx.fill();}}ctx.fillStyle='#22c55e';ctx.fillRect(POS.ENTRADA.x*W-4,POS.ENTRADA.y*H-4,W+8,H+8);ctx.fillStyle='#000';ctx.font='bold 8px Arial';ctx.fillText('ENTRADA',POS.ENTRADA.x*W-2,POS.ENTRADA.y*H+4);for(let i=0;i<rastro.length;i++){let p=rastro[i];let a=(i+1)/rastro.length;ctx.fillStyle=`rgba(34,197,94,${0.4+a*0.6})`;ctx.beginPath();ctx.arc(p.x*W+20,p.y*H+13,6*a+2,0,6.28);ctx.fill();}if(!(tx==POS.WAY.x&&ty==POS.WAY.y)){ctx.fillStyle='#ef4444';ctx.fillRect(tx*W-2,ty*H-2,W+4,H+4);}ctx.fillStyle='#facc15';ctx.shadowColor='#facc15';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(px*W+20,py*H+13,11,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.restore();document.getElementById('console').innerText=`V54.1 | 31 CAIXAS | PRODUTO: ${produtoAtual} | CAIXAS LIVRES: ${caixas.filter(c=>c.fila<2).length}/31`;localStorage.setItem('v54_pos',JSON.stringify({px,py}));}
function mostrarCaixa(){let caixa=pegaCaixaLivre();let preco=precos[produtoAtual]||"R$ 9,99";document.getElementById('cProd').innerText=produtoAtual;document.getElementById('cPreco').innerText=preco;document.getElementById('cCaixa').innerText=`🟢 VÁ PARA O CAIXA ${caixa.id}`;document.getElementById('cFila').innerText=`Fila atual: ${caixa.fila} pessoas | Tempo estimado: ${caixa.fila*2} min | 31 caixas ativos`;document.getElementById('caixaInfo').style.display='block';}
function step(){if(cam.length==0){clearInterval(tm);tm=null;mostrarCaixa();draw();return;}let p=cam.shift();rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=p.x;py=p.y;dot[py][px]=false;draw();}
function mover(dx,dy){if(tm){clearInterval(tm);tm=null;}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=nx;py=ny;dot[py][px]=false;draw();}
function ir(x,y){if(tm){clearInterval(tm);tm=null;}if(x==POS.WAY.x&&y==POS.WAY.y) rastro=[];tx=x;ty=y;cam=achar(px,py,x,y);if(cam.length==0){rastro.push({x:px,y:py});px=x;py=y;draw();mostrarCaixa();return;}tm=setInterval(step,120);draw();}
function loop(){updateCam();draw();requestAnimationFrame(loop);}
init();resize();draw();loop();
let sx=0,sy=0;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;});
cv.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<20&&Math.abs(dy)<20) return; if(Math.abs(dx)>Math.abs(dy)){mover(dx>0?1:-1,0)}else{mover(0,dy>0?1:-1)}});
</script>
</body>
</html>
