<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V47 FLAG PRA BAIXO</title>
<style>
body{background:#000;margin:0;color:#fff;font-family:Arial}
#gps{background:#052e16;color:#22c55e;padding:6px;text-align:center;font-size:12px;font-weight:bold}
canvas{border:3px solid #facc15;background:#000;display:block;margin:0 auto}
.btns{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px}
button{height:44px;border-radius:10px;border:2px solid #facc15;font-weight:bold;font-size:12px}
.bm{width:48px;background:#222;color:#facc15}
.bprod{width:104px;background:#a855f7;color:#fff}
.bway{width:104px;background:#22c55e;color:#000}
</style>
</head>
<body>
<div id="gps">V47 - BANDEIRA PRA BAIXO NO TANG 33</div>
<div id="top" style="text-align:center;color:#facc15;font-size:12px;padding:6px;font-weight:bold"></div>
<canvas id="c" width="800" height="400"></canvas>
<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<button class="bprod" onclick="ir(POS.TANG.x,POS.TANG.y)">TANG 364</button>
<button class="bprod" onclick="ir(POS.PROD.x,POS.PROD.y)">PROD 340</button>
<button class="bway" onclick="ir(POS.WAY.x,POS.WAY.y)">📦 WAY</button>
</div>
<script>
const POS={TANG:{x:33,y:1},PROD:{x:35,y:1},WAY:{x:0,y:16}};
const COLS=40,ROWS=19,W=20,H=20;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let px=POS.WAY.x,py=POS.WAY.y,tx=POS.WAY.x,ty=POS.WAY.y,cam=[],tm=null,lab=[],dot=[],camX=0,camY=0,chegou=false;
const tangImg=new Image();tangImg.src='IMG-20260926-WA7510.jpg';
for(let y=0;y<ROWS;y++){lab[y]=[];dot[y]=[];for(let x=0;x<COLS;x++){lab[y][x]=(y==0||y==8||y==17||x==0||x==39)?0:(x%5<3)?1:0;dot[y][x]=lab[y][x]==0;}}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v=new Set([sx+','+sy]);while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v.has(k)&&livre(nx,ny)){v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]})}}}return []}
function updateCamera(){camX=px*W-cv.width/2+W/2;camY=py*H-cv.height/2+H/2;camX=Math.max(0,Math.min(camX,COLS*W-cv.width));camY=Math.max(0,Math.min(camY,ROWS*H-cv.height));}
function draw(){
 updateCamera();
 ctx.fillStyle='#000';ctx.fillRect(0,0,800,400);
 ctx.save();ctx.translate(-camX,-camY);
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  if(lab[y][x]==1){ctx.fillStyle='#1e40af';ctx.fillRect(x*W,y*H,W,H);}
  else if(dot[y][x]){ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(x*W+10,y*H+10,3,0,6.28);ctx.fill();}
 }
 // Destino vermelho - SÓ TANG/PROD
 if(!(tx==POS.WAY.x && ty==POS.WAY.y)){ctx.fillStyle='#ef4444';ctx.fillRect(tx*W,ty*H,W,H);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(tx*W,ty*H,W,H);}

 // BANDEIRA SEMPRE PRA BAIXO NO TOPO
 if(px==tx && py==ty &&!(tx==POS.WAY.x && ty==POS.WAY.y)){
   let bx=tx*W,by=ty*H;
   let flagY = by+22; // SEMPRE PRA BAIXO
   let fx = bx-50; // centraliza
   if(fx<camX+2) fx=camX+2;
   if(fx+125>camX+800-2) fx=camX+800-127;

   // mastro pra baixo
   ctx.fillStyle='#facc15';ctx.fillRect(bx+8,by+20,4,60);
   // caixa branca
   ctx.fillStyle='#fff';ctx.fillRect(fx,flagY,125,58);ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.strokeRect(fx,flagY,125,58);
   ctx.fillStyle='#000';ctx.font='bold 12px Arial';ctx.fillText('📍 CHEGOU!',fx+8,flagY+18);
   ctx.font='bold 10px Arial';ctx.fillText('TANG 364 - X33',fx+8,flagY+32);
   ctx.font='bold 8px Arial';ctx.fillText('BAIA 33',fx+8,flagY+45);
   //
