<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ATACADÃO 364 V19 GPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
body{display:flex;flex-direction:column}
#top{background:#facc15;color:#000;padding:2px;text-align:center;font-size:7px;font-weight:bold;flex-shrink:0}
#gpsbox{background:#052e16;border:1px solid #22c55e;color:#22c55e;padding:3px;text-align:center;font-size:8px;flex-shrink:0}
#game{flex:1;overflow:auto;background:#000;display:block}
#map{display:grid;gap:1px;background:#222;padding:2px;border:2px solid #facc15;width:max-content}
.cell{width:13px;height:13px;display:flex;align-items:center;justify-content:center;font-size:4px}
.wall{background:#1e40af}
.corr{background:#000;outline:1px dashed #facc15}
.caixa{background:#fde68a;color:#000;font-weight:bold;font-size:4px}
.player{background:#facc15!important;border-radius:50%;border:1px solid #fff;box-shadow:0 0 4px #facc15;font-size:8px;z-index:10}
#bottom{flex-shrink:0;background:#111;border-top:2px solid #facc15;padding:3px}
#controls{display:flex;justify-content:center;align-items:center;gap:5px;padding:3px}
#controls button{width:38px;height:30px;background:#222;color:#facc15;border:1px solid #facc15;border-radius:8px;font-size:14px}
#pos{font-size:6px;text-align:center;color:#999}
</style>
</head>

<div id="top">🛒 364 V19 | CORREDOR VOLTA TOTAL + LAT + 13 BAIAS + GPS REAL ATIVO</div>
<div id="gpsbox">📍 GPS: Aguardando... Clique no botão verde 📍GPS REAL</div>
<div id="game"><div id="map"></div></div>
<div id="bottom">
<div id="controls">
<button onclick="mover(-1,0)">←</button>
<button onclick="mover(0,-1)">↑</button>
<button onclick="mover(0,1)">↓</button>
<button onclick="mover(1,0)">→</button>
<button onclick="ativarGPS()" style="background:#22c55e;color:#000;width:70px;font-size:8px;font-weight:bold" id="btnGps">📍 GPS REAL</button>
</div>

<script>
const COLS=43, ROWS=19;
let px=15, py=18, gpsAtivo=false, lat=0, lng=0;
let lab=[];
for(let y=0;y<ROWS;y++){
 lab[y]=[];
 for(let x=0;x<COLS;x++){
  if(y==18 && x>=15 && x<=27) lab[y][x]=2;
  else if(y==0 || y==17 || y==8 || x==0 || x==1 || x==COLS-2 || x==COLS-1) lab[y][x]=0;
  else { let pos=(x-2)%3; lab[y][x]=(pos<2)?1:0; }
 }
}
function criar(){
const m=document.getElementById('map'); m.style.gridTemplateColumns=`repeat(${COLS},13px)`;
for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
 let c=document.createElement('div'); c.className='cell'; c.id=`c-${x}-${y}`;
 let v=lab[y][x];
 if(v==1){c.classList.add('wall'); if(y==1) c.innerText=`B${Math.floor((x-2)/3)+1}`; c.style.color='#fff';}
 else if(v==2){c.classList.add('caixa'); c.innerText='0,0';}
 else {c.classList.add('corr'); if((y==0||y==8||y==17) && x%3==0) c.innerText='5M';}
 m.appendChild(c);
}
atualiza();
ativarGPS(); // << GPS JA LIGA SOZINHO AO ABRIR
}
function atualiza(){
document.querySelectorAll('.player').forEach(e=>{
  e.classList.remove('player');
  if(e.classList.contains('caixa')) e.innerText='0,0';
  else {
    let p=e.id.split('-'); let x=parseInt(p[1]), y=parseInt(p[2]);
    if(y==1 && e.classList.contains('wall')) e.innerText=`B${Math.floor((x-2)/3)+1}`;
    else if((y==0||y==8||y==17) && x%3==0 &&!e.classList.contains('wall')) e.innerText='5M';
    else e.innerText='';
  }
});
let a=document.getElementById(`c-${px}-${py}`); a.classList.add('player'); a.innerText='🛒';
let b=Math.floor((px-2)/3)+1; if(b<1) b=1; if(b>13) b=13;
let local=py==18?'CAIXAS 0,0 ORIGEM':py==0?'CORR CIMA':py==8?'CORR MEIO 5M':py==17?'CORR BAIXO SAIDA':(px<=1||px>=COLS-2)?'CORR LATERAL':'GAP 3M';
document.getElementById('pos').innerText=`JOGO X:${px} Y:${py} B${b}/13 ${local} | ALT 2.5M | Mo M+13 | PAC-MAN VOLTA TOTAL`;
document.getElementById('game').scrollLeft=(px*13)-60;
atualizaGPSBox();
}
