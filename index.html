<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>V55.5 GONDOLA TAMANHO REAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#top{background:#facc15;color:#000;padding:3px;text-align:center;font-size:9px;font-weight:bold}
#bar{font-size:8px;background:#111;color:#22c55e;padding:3px;white-space:nowrap;overflow-x:auto;min-height:18px;border-bottom:1px solid #facc15}
canvas{flex:1;width:100%;background:#000;border:2px solid #facc15;display:block}
.btns{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:3px;background:#0a0a0a}
button{height:30px;border-radius:6px;border:1px solid #facc15;font-weight:bold;font-size:9px}
.bm{background:#222;color:#facc15;font-size:12px}
.bgo{background:#22c55e;color:#000}
.badd{background:#facc15;color:#000}
#combo{grid-column:span 2;height:30px;border-radius:6px;border:1px solid #facc15;background:#fff;color:#000;font-size:9px;font-weight:bold}
</style>
</head>
<body>
<div id="top">V55.5 - 13 GONDOLAS ALTAS REAIS - BOTAO PEQUENO</div>
<div id="bar">🛒 0 itens</div>
<canvas id="c"></canvas>
<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<select id="combo">
<option value="2,2">🍚 ARROZ [25-26]</option>
<option value="4,2">🫘 FEIJAO [23-24]</option>
<option value="6,2">🫒 OLEO [21-22]</option>
<option value="8,2">🍬 ACUCAR [19-20]</option>
<option value="10,2">☕ CAFE [17-18]</option>
<option value="12,2">🍝 MACARRAO [15-16]</option>
<option value="14,2">🍪 BISCOITO [13-14]</option>
<option value="16,2">🥛 LEITE [11-12]</option>
<option value="18,2">🧈 MANTEIGA [9-10]</option>
<option value="20,2">🧀 QUEIJO [7-8]</option>
<option value="22,2">🥤 REFRI [5-6]</option>
<option value="24,2">💧 AGUA [3-4]</option>
<option value="2,5">🍺 CERVEJA</option>
<option value="10,10">🥩 CARNE</option>
<option value="2,10">🍞 PAO</option>
<option value="24,10">🍌 BANANA</option>
</select>
<button class="badd" onclick="add()">+LISTA</button>
</div>
<div class="btns" style="padding-top:1px">
<button class="bm" onclick="ir(26,15)" style="background:#22c55e;color:#000">ENTRADA</button>
<button class="bgo" onclick="gerar()" style="grid-column:span 3">🗺️ ROTA RÁPIDA</button>
<button class="bm" onclick="limpar()" style="background:#ef4444;color:#fff">X</button>
<button class="bm" onclick="mover(0,-3)">↑↑</button>
</div>
<script>
const COLS=27,ROWS=19,W=40,H=26; // MESMO DA V54.8
let lab=[],px=26,py=15,cam=[],tm=null,lista=[];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

function init(){
 lab=[];
 for(let y=0;y<ROWS;y++){
   lab[y]=[];
   for(let x=0;x<COLS;x++){
     // IGUAL V54.8 ORIGINAL
     if(y==0||y==8||y==17||x==0||x==COLS-1) lab[y][x]=0; // corredor
     else if(x%2==1) lab[y][x]=1; // GONDOLA ALTA VERTICAL
     else lab[y][x]=0; // corredor entre gondolas
   }
 }
}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){
 let q=[{x:sx,y:sy,p:[]}],v={};v[sx+','+sy]=1;
 while(q.length){
   let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;
   for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){
     let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;
     if(!v[k]&&livre(nx,ny)){v[k]=1;q.push({x:nx,y:ny,p:c.p.concat([{x:nx,y:ny}])})}
   }
 }return [];
}
function resize(){
 let r=cv.getBoundingClientRect();
 cv.width=r.width; cv.height=r.height;
 draw();
}
function draw(){
 ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
 // CAMERA SIMPLES - SEM BUG
 let camX=px*W - cv.width/2 + W/2;
 let camY=py*H - cv.height/2 + H/2;
 ctx.save();ctx.translate(-camX,-camY);
 // GONDOLAS ALTAS - TAMANHO REAL V54.8
 for(let y=0;y<ROWS;y++){
  for(let x=0;x<COLS;x++){
   if(lab[y][x]==1){
     ctx.fillStyle='#0a194e';ctx.fillRect(x*W,y*H,W,H);
     ctx.fillStyle='#1e40af';ctx.fillRect(x*W+2,y*H+2,W-4,H-4);
     if(y==1||y==9){
       ctx.fillStyle='#facc15';ctx.font='bold 9px Arial';ctx.textAlign='center';
       let n='';if(x==25)n='1-2';else if(x==23)n='3-4';else if(x==21)n='5-6';else if(x==19)n='7-8';else if(x==17)n='9-10';else if(x==15)n='11-12';else if(x==13)n='13-14';else if(x==11)n='15-16';else if(x==9)n='17-18';else if(x==7)n='19-20';else if(x==5)n='21-22';else if(x==3)n='23-24';else if(x==1)n='25-26';
       ctx.fillText(n,x*W+W/2,y*H+12);
     }
   }else{
     // bolinha do chão
     if(y!=0&&y!=8&&y!=17){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x*W+W/2,y*H+H/2,1.5,0,6.28);ctx.fill();}
   }
  }
 }
 // ENTRADA VERDE GRANDE
 ctx.fillStyle='#22c55e';ctx.fillRect(26*W,15*H,W,H);ctx.fillStyle='#000';ctx.font='bold 8px Arial';ctx.fillText('ENTRADA',26*W+1,15*H+16);
 // ROTA VERDE
 if(cam.length>1){
   ctx.strokeStyle='#22c55e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px*W+W/2,py*H+H/2);
   for(let p of cam) ctx.lineTo(p.x*W+W/2,p.y*H+H/2);
   ctx.stroke();
 }
 // PINS DA LISTA
 lista.forEach((it,i)=>{
   ctx.fillStyle=it.visitado?'#22c55e':'#ef4444';
   ctx.beginPath();ctx.arc(it.x*W+W/2,it.y*H+H/2,11,0,6.28);ctx.fill();
   ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(i+1,it.x*W+W/2,it.y*H+H/2+3);
 });
 // PLAYER AMARELO
 ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(px*W+W/2,py*H+H/2,10,0,6.28);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
 ctx.restore();
}
function step(){if(!cam.length){clearInterval(tm);tm=null;return;}let p=cam.shift();px=p.x;py=p.y;draw();}
function mover(dx,dy){if(tm){clearInterval(tm);tm=null;}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;px=nx;py=ny;draw();}
function ir(x,y){if(lab[y][x]==1){if(x>0&&lab[y][x-1]!=1)x--;else x++;}let c=achar(px,py,x,y);cam=c;if(tm)clearInterval(tm);tm=setInterval(step,80);draw();}
function add(){
 let v=document.getElementById('combo').value.split(',');let x=+v[0],y=+v[1];let txt=document.getElementById('combo').options[document.getElementById('combo').selectedIndex].text;
 if(lista.find(i=>i.x==x&&i.y==y))return;
 lista.push({x,y,txt,visitado:false});
 document.getElementById('bar').innerHTML=lista.map((l,i)=>`${i+1}.${l.txt}`).join(' | ')+` [${lista.length}]`;
 draw();
}
function limpar(){lista=[];cam=[];if(tm)clearInterval(tm);document.getElementById('bar').innerHTML='🛒 0 itens';draw();}
function gerar(){
 if(!lista.length)return;
 let rest=[...lista],atual={x:px,y:py},ordem=[],total=[];
 while(rest.length){
   rest.sort((a,b)=> (Math.abs(atual.x-a.x)+Math.abs(atual.y-a.y)) - (Math.abs(atual.x-b.x)+Math.abs(atual.y-b.y)) );
   let prox=rest.shift();ordem.push(prox);let tr=achar(atual.x,atual.y,prox.x,prox.y);total=total.concat(tr);atual=prox;
 }
 lista=ordem;cam=total;
 document.getElementById('bar').innerHTML='✅ '+ordem.map(o=>o.txt).join(' → ')+' | '+total.length+' passos';
 if(tm)clearInterval(tm);tm=setInterval(step,80);
}
window.addEventListener('resize',resize);
init();resize();draw();
</script>
</body>
</html>
