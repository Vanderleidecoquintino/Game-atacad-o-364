<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V54 - MAPA + COMBO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column}
#gps{background:#facc15;color:#000;padding:10px;text-align:center;font-weight:bold;cursor:pointer}
#console{background:#111;color:#22c55e;padding:5px;font-family:monospace;font-size:9px;height:40px}
#c{width:100%;height:55vh;background:#111;border-top:3px solid #facc15;border-bottom:3px solid #facc15;display:block}
.combo-area{background:#0a0a0a;padding:8px;display:flex;gap:6px}
#combo{flex:1;height:54px;background:#222;color:#facc15;border:2px solid #facc15;border-radius:12px;font-weight:bold;padding:0 12px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:#0a0a0a}
button{height:54px;border-radius:12px;border:2px solid #facc15;font-weight:bold}
.bm{background:#333;color:#facc15;font-size:22px}
.bway{background:#22c55e;color:#000}
</style>
</head>
<body>
<div id="gps" onclick="GPS.iniciar()">📍 CLICA AQUI PRA LIGAR O GPS</div>
<div id="console">CARREGANDO MAPA...</div>
<canvas id="c"></canvas>

<div class="combo-area">

<option value="6,5">🧴 HIGIENE</option>
<option value="10,10">🐶 RACAO C11</option>
</select>
<button class="bway" onclick="ir(12,15)">ENTRADA</button>
</div>

<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
</div>

<script>
const COLS=13,ROWS=19,W=40,H=26;
let produtoAtual="TANG 364";
let lab=[],px=12,py=15,tx=10,ty=1,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

const GPS={ativo:false,iniciar(){
  if(!navigator.geolocation){document.getElementById('gps').innerText='GPS NAO SUPORTADO';return;}
  document.getElementById('gps').innerText='BUSCANDO GPS...';
  navigator.geolocation.watchPosition(p=>{
    this.ativo=true;
    document.getElementById('gps').style.background='#22c55e';
    document.getElementById('gps').innerText=`GPS ON ${p.coords.latitude.toFixed(5)}`;
  },e=>{
    document.getElementById('gps').style.background='#ef4444';
    document.getElementById('gps').innerText='GPS ERRO: '+e.message;
  },{enableHighAccuracy:true});
}};

function trocarProduto(){
  let v=document.getElementById('combo').value.split(',');
  let t=document.getElementById('combo').options[document.getElementById('combo').selectedIndex].text;
  produtoAtual=t; ir(parseInt(v[0]),parseInt(v[1]));
}
function init(){
  for(let y=0;y<ROWS;y++){lab[y]=[];for(let x=0;x<COLS;x++){
    if(y==0||y==8||y==17||x==0||x==12) lab[y][x]=0; else if(x%2==1) lab[y][x]=1; else lab[y][x]=0;
  }}
}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v=new Set([sx+','+sy]);while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v.has(k)&&livre(nx,ny)){v.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]})}}}return []}
