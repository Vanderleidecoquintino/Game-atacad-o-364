<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>V56.2 - BOTOES CENTRALIZADOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100dvh;overflow:hidden}
#tela1{height:100dvh;display:flex;flex-direction:column}
#t1top{background:#facc15;color:#000;padding:12px;text-align:center;font-weight:900;font-size:14px}
#t1lista{background:#111;padding:8px;min-height:45px;max-height:75px;overflow:auto;border-bottom:2px solid #22c55e;font-size:11px}
#t1produtos{flex:1;overflow:auto;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prod{border:2px solid #333;background:#111;border-radius:12px;padding:8px;text-align:center}
.prod.sel{border-color:#22c55e;background:#0a2a12}
.prod button{width:100%;margin-top:5px;height:28px;border-radius:8px;border:1px solid #facc15;background:#facc15;color:#000;font-weight:bold;font-size:9px}

/* AQUI ESTA O FIX DOS BOTOES CENTRALIZADOS */
#t1btns{padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#t1btns button{height:44px;border-radius:10px;border:2px solid #facc15;font-weight:900;font-size:10px}
.linha1{display:flex;justify-content:center;gap:6px;width:100%;max-width:400px}
.linha1 button{flex:1}
#btnGo{background:#22c55e;color:#000;width:100%;max-width:400px}

#totalBar{background:#0a2a12;border-top:2px solid #22c55e;padding:6px;text-align:center;font-weight:900;color:#22c55e;font-size:13px}
#tela2{display:none;height:100dvh;flex-direction:column;position:relative}
#gps{background:#facc15;color:#000;padding:5px;text-align:center;font-size:10px;font-weight:bold}
#console{background:#111;color:#22c55e;padding:4px;font-size:9px;border-bottom:1px solid #facc15}
canvas{flex:1;width:100%;background:#000;border:2px solid #facc15;display:block}
.btns{display:grid;grid-template-columns:36px 36px 36px 36px 1fr 56px;gap:4px;padding:4px;background:#0a0a0a}
button{height:36px;border-radius:8px;border:1.5px solid #facc15;font-weight:bold}
.bm{background:#222;color:#facc15}
.bway{background:#22c55e;color:#000;font-size:8px}
#combo{height:36px;border-radius:8px;border:1.5px solid #facc15;background:#fff;color:#000;font-weight:bold;font-size:10px;width:100%}
#modalPego{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:16px;border-radius:18px;border:3px solid #22c55e;z-index:100;display:none;text-align:center;min-width:260px;box-shadow:0 0 40px rgba(0,0,0,0.9)}
</style>
</head>
<body>
<div id="tela1">
<div id="t1top">🛒 ATACADÃO 364 - V56.2 BOTOES NO CENTRO</div>
<div id="t1lista">Toque + pra adicionar - Salva automático</div>
<div id="t1produtos"></div>
<div id="totalBar">TOTAL: R$ 0,00 (0 itens)</div>

<!-- BOTOES AGORA 100% CENTRALIZADOS -->
<div id="t1btns">
  <div class="linha1">
    <button onclick="limparT1()" style="background:#333;color:#fff">🗑️ LIMPAR</button>
    <button onclick="salvarLista()" style="background:#1e40af;color:#fff">💾 SALVAR</button>
  </div>
  <button id="btnGo" onclick="irParaMercado()">🗺️ IR MERCADO (0)</button>
</div>

</div>
<div id="tela2">
<div id="gps">V56.2 - 13 GONDOLAS - VEL AJUSTAVEL</div>
<div id="console">Pronto</div>
<canvas id="c"></canvas>
<div id="modalPego">
<div style="font-weight:bold;color:#16a34a">📍 CHEGOU NA GÔNDOLA!</div>
<div id="modalProd" style="font-size:44px;margin:8px 0">🍚</div>
<div id="modalNome" style="font-weight:900;font-size:14px"></div>
<div id="modalGond" style="font-size:10px;color:#facc15;font-weight:bold"></div>
<div id="modalPreco" style="color:#16a34a;font-weight:900;font-size:22px"></div>
<div id="modalProgress" style="font-size:10px;color:#666;margin:4px 0"></div>
<div id="modalTotal" style="font-size:11px;color:#000;font-weight:bold;background:#facc15;padding:3px;border-radius:6px;margin:4px 0"></div>
<button onclick="confirmarPego()" style="width:100%;height:48px;background:#22c55e;color:#000;border:2px solid #000;border-radius:10px;margin-top:10px;font-weight:900;font-size:14px">✅ PEGUEI! PRÓXIMO →</button>
<button onclick="pularItem()" style="width:100%;height:32px;background:#fff;color:#666;border:1px solid #ccc;border-radius:8px;margin-top:5px;font-size:10px">PULAR ESTE</button>
</div>
<div class="btns">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<select id="combo"></select>
<button class="bway" onclick="ir(26,15)">ENTRADA</button>
</div>
<div class="btns" style="padding-top:2px">
<button onclick="voltarLista()" style="background:#333;color:#fff;font-size:8px">← LISTA</button>
<button onclick="gerarRotaDaLista()" style="grid-column:span 2;background:#facc15;color:#000;font-size:11px">🗺️ INICIAR ROTA</button>
<button onclick="falarLista()" style="background:#1e40af;color:#fff;font-size:8px">🔊 FALAR</button>
<button class="bm" onclick="mudaVel(-40)">↑↑</button>
<button class="bm" onclick="mudaVel(40)">↓↓</button>
</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  const firebaseConfig = { apiKey: "SUA_API_KEY", authDomain: "SEU_AUTH_DOMAIN" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.href = "login.html"; }
  });
</script>

<script>
const produtos=[{x:24,y:1,nome:"TANG",emo:"🧃",preco:"R$ 1,49",g:"1-2"},{x:2,y:2,nome:"ARROZ",emo:"🍚",preco:"R$ 22,90",g:"25-26"},{x:4,y:2,nome:"FEIJAO",emo:"🫘",preco:"R$ 8,99",g:"23-24"},{x:6,y:2,nome:"OLEO",emo:"🫒",preco:"R$ 7,49",g:"21-22"},{x:8,y:2,nome:"ACUCAR",emo:"🍬",preco:"R$ 4,99",g:"19-20"},{x:10,y:2,nome:"CAFE",emo:"☕",preco:"R$ 14,90",g:"17-18"},{x:12,y:2,nome:"MACARRAO",emo:"🍝",preco:"R$ 3,99",g:"15-16"},{x:14,y:2,nome:"BISCOITO",emo:"🍪",preco:"R$ 3,49",g:"13-14"},{x:16,y:2,nome:"LEITE",emo:"🥛",preco:"R$ 4,89",g:"11-12"},{x:18,y:2,nome:"MANTEIGA",emo:"🧈",preco:"R$ 9,90",g:"9-10"},{x:20,y:2,nome:"QUEIJO",emo:"🧀",preco:"R$ 29,90",g:"7-8"},{x:22,y:2,nome:"REFRI",emo:"🥤",preco:"R$ 8,99",g:"5-6"},{x:24,y:2,nome:"AGUA",emo:"💧",preco:"R$ 2,49",g:"3-4"},{x:2,y:5,nome:"CERVEJA",emo:"🍺",preco:"R$ 3,99",g:"25-26"},{x:4,y:5,nome:"SUCO",emo:"🧃",preco:"R$ 6,99",g:"23-24"},{x:6,y:5,nome:"ENERGETICO",emo:"⚡",preco:"R$ 7,99",g:"21-22"},{x:8,y:5,nome:"SABAO PO",emo:"🧼",preco:"R$ 12,90",g:"19-20"},{x:10,y:5,nome:"DETERGENTE",emo:"🧴",preco:"R$ 2,49",g:"17-18"},{x:12,y:5,nome:"AMACIANTE",emo:"👕",preco:"R$ 9,90",g:"15-16"},{x:14,y:5,nome:"DESINFETANTE",emo:"✨",preco:"R$ 6,99",g:"13-14"},{x:16,y:5,nome:"PAPEL HIG",emo:"🧻",preco:"R$ 15,90",g:"11-12"},{x:18,y:5,nome:"SABONETE",emo:"🧼",preco:"R$ 2,99",g:"9-10"},{x:20,y:5,nome:"SHAMPOO",emo:"💆",preco:"R$ 15,90",g:"7-8"},{x:22,y:5,nome:"CREME DENTAL",emo:"🪥",preco:"R$ 4,99",g:"5-6"},{x:24,y:5,nome:"DESODORANTE",emo:"💨",preco:"R$ 12,90",g:"3-4"},{x:2,y:10,nome:"PAO",emo:"🍞",preco:"R$ 0,89",g:"25-26"},{x:4,y:10,nome:"BOLO",emo:"🍰",preco:"R$ 6,90",g:"23-24"},{x:6,y:10,nome:"PRESUNTO",emo:"🍖",preco:"R$ 32,90",g:"21-22"},{x:8,y:10,nome:"MUSSARELA",emo:"🧀",preco:"R$ 39,90",g:"19-20"},{x:10,y:10,nome:"CARNE",emo:"🥩",preco:"R$ 29,90",g:"17-18"},{x:12,y:10,nome:"FRANGO",emo:"🍗",preco:"R$ 18,90",g:"15-16"},{x:14,y:10,nome:"LINGUICA",emo:"🌭",preco:"R$ 22,90",g:"13-14"},{x:16,y:10,nome:"OVOS",emo:"🥚",preco:"R$ 14,90",g:"11-12"},{x:18,y:10,nome:"TOMATE",emo:"🍅",preco:"R$ 7,90",g:"9-10"},{x:20,y:10,nome:"BATATA",emo:"🥔",preco:"R$ 5,90",g:"7-8"},{x:22,y:10,nome:"CEBOLA",emo:"🧅",preco:"R$ 4,90",g:"5-6"},{x:24,y:10,nome:"BANANA",emo:"🍌",preco:"R$ 6,90",g:"3-4"},{x:2,y:12,nome:"MACA",emo:"🍎",preco:"R$ 9,90",g:"25-26"},{x:4,y:12,nome:"RACAO CAO",emo:"🐶",preco:"R$ 89,90",g:"23-24"},{x:6,y:12,nome:"RACAO GATO",emo:"🐱",preco:"R$ 79,90",g:"21-22"}];
let listaT1=JSON.parse(localStorage.getItem('atacadao364_v56')||'[]');
function falar(texto){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(texto);u.lang='pt-BR';u.rate=1.1;speechSynthesis.cancel();speechSynthesis.speak(u);}}
function falarLista(){if(!listaT1.length){falar('Lista vazia');return;}falar(`Sua lista tem ${listaT1.length} itens. ${listaT1.map(l=>l.nome).join(', ')}`);}
function calcTotal(){return listaT1.reduce((s,p)=>s+parseFloat(p.preco.replace('R$','').replace(',','.')),0);}
function salvarLista(){localStorage.setItem('atacadao364_v56',JSON.stringify(listaT1));document.getElementById('t1lista').innerHTML='💾 Lista salva no celular!';setTimeout(renderT1,1000);}
function renderT1(){
 let cont=document.getElementById('t1produtos');cont.innerHTML='';
 produtos.forEach((p,i)=>{
   let sel=listaT1.find(l=>l.x==p.x&&l.y==p.y);
   let div=document.createElement('div');div.className='prod'+(sel?' sel':'');
   div.innerHTML=`<div style="font-size:26px">${p.emo}</div><div style="font-size:10px;font-weight:bold">${p.nome}</div><div style="font-size:10px;color:#22c55e">${p.preco}</div><div style="font-size:8px;color:#facc15">[${p.g}]</div><button onclick="toggleProd(${i})">${sel?'✓ NA LISTA':'+ ADD'}</button>`;
   cont.appendChild(div);
 });
 let total=calcTotal();
 document.getElementById('t1lista').innerHTML=listaT1.length==0?'Toque + pra adicionar - Salva automático':listaT1.map(l=>`${l.emo} ${l.nome}`).join(' | ')+` [${listaT1.length}]`;
 document.getElementById('totalBar').innerText=`TOTAL: R$ ${total.toFixed(2).replace('.',',')} (${listaT1.length} itens)`;
 document.getElementById('btnGo').innerText=`🗺️ IR MERCADO (${listaT1.length})`;
 let combo=document.getElementById('combo');combo.innerHTML='';
 produtos.forEach(p=>{let o=document.createElement('option');o.value=p.x+','+p.y;o.innerText=`${p.emo} ${p.nome} [${p.g}]`;combo.appendChild(o);});
 localStorage.setItem('atacadao364_v56',JSON.stringify(listaT1));
}
function toggleProd(i){let p=produtos[i];let idx=listaT1.findIndex(l=>l.x==p.x&&l.y==p.y);if(idx>=0) listaT1.splice(idx,1);else listaT1.push({...p});renderT1();if(navigator.vibrate) navigator.vibrate(50);}
function limparT1(){if(!confirm('Limpar lista?')) return;listaT1=[];localStorage.removeItem('atacadao364_v56');renderT1();}
function irParaMercado(){if(!listaT1.length){alert('Adicione 1 produto!');return;}falar(`Iniciando rota com ${listaT1.length} itens, total ${calcTotal().toFixed(2)} reais`);document.getElementById('tela1').style.display='none';document.getElementById('tela2').style.display='flex';init();resize();draw();loop();setTimeout(()=>{gerarRotaDaLista();},400);}
function voltarLista(){document.getElementById('tela2').style.display='none';document.getElementById('tela1').style.display='flex';if(tm){clearInterval(tm);tm=null;}document.getElementById('modalPego').style.display='none';}
const COLS=27,ROWS=19,W=40,H=26;
let lab=[],px=26,py=15,tx=26,ty=15,cam=[],tm=null,camX=0,camY=0,rastro=[],vw=0,vh=0,vel=250;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let idxRota=0,esperando=false,listaOrdenada=[];
function mudaVel(d){vel+=d;if(vel<30) vel=30;if(vel>5000) vel=5000;document.getElementById('gps').innerText='V56.1 - VEL '+vel+'ms - '+(d<0?'MAIS RAPIDO':'MAIS DEVAGAR');if(tm){ clearInterval(tm); tm=setInterval(step,vel); }}
function gerarRotaDaLista(){listaT1.forEach(l=>l.visitado=false);let resto=[...listaT1],atual={x:26,y:15},ordem=[];while(resto.length){resto.sort((a,b)=>(Math.abs(atual.x-a.x)+Math.abs(atual.y-a.y))-(Math.abs(atual.x-b.x)+Math.abs(atual.y-b.y)));let prox=resto.shift();ordem.push(prox);atual=prox;}listaOrdenada=ordem;idxRota=0;irParaProximoDaLista();}
function irParaProximoDaLista(){if(idxRota>=listaOrdenada.length){let total=calcTotal();document.getElementById('console').innerText='🎉 LISTA COMPLETA!';falar(`Lista completa! ${listaOrdenada.length} itens, total ${total.toFixed(2)} reais. Indo para o caixa.`);alert(`🎉 FINALIZADO! ${listaOrdenada.length} itens - Total R$ ${total.toFixed(2).replace('.',',')}`);return;}ir(listaOrdenada[idxRota].x,listaOrdenada[idxRota].y);}
function mostrarModalPego(item){
 document.getElementById('modalProd').innerText=item.emo;
 document.getElementById('modalNome').innerText=item.nome;
 document.getElementById('modalGond').innerText='GÔNDOLA ['+item.g+']';
 document.getElementById('modalPreco').innerText=item.preco;
 document.getElementById('modalProgress').innerText='Item '+(idxRota+1)+'/'+listaOrdenada.length;
 let total=calcTotal();
 let pegos=listaOrdenada.filter(l=>l.visitado).length;
 document.getElementById('modalTotal').innerText=`TOTAL PARCIAL: R$ ${total.toFixed(2).replace('.',',')} | ${pegos+1}/${listaOrdenada.length} PEGOS`;
 document.getElementById('modalPego').style.display='block';
 falar(`Chegou no ${item.nome}, gôndola ${item.g}, preço ${item.preco}`);
 if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function confirmarPego(){listaOrdenada[idxRota].visitado=true;document.getElementById('modalPego').style.display='none';idxRota++;esperando=false;setTimeout(()=>{irParaProximoDaLista();},500);}
function pularItem(){document.getElementById('modalPego').style.display='none';falar(`Pulando ${listaOrdenada[idxRota].nome}`);idxRota++;irParaProximoDaLista();}
function init(){lab=[];for(let y=0;y<ROWS;y++){lab[y]=[];for(let x=0;x<COLS;x++){if(y==0||y==8||y==17||x==0||x==COLS-1) lab[y][x]=0; else if(x%2==1) lab[y][x]=1; else lab[y][x]=0;}}}
function livre(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&lab[y][x]!=1}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}],v={};v[sx+','+sy]=1;while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=c.x+d[0],ny=c.y+d[1],k=nx+','+ny;if(!v[k]&&livre(nx,ny)){v[k]=1;q.push({x:nx,y:ny,p:c.p.concat([{x:nx,y:ny}])})}}}return []}
function resize(){let r=cv.getBoundingClientRect();vw=r.width;vh=r.height||400;cv.width=vw;cv.height=vh;draw();}
function updateCam(){let tX=px*W - vw/2 + W/2, tY=py*H - vh/2 + H/2; camX+=(tX-camX)*0.12; camY+=(tY-camY)*0.12;let maxX=Math.max(0,COLS*W-vw),maxY=Math.max(0,ROWS*H-vh);camX=Math.max(0,Math.min(maxX,camX));camY=Math.max(0,Math.min(maxY,camY));}
function draw(){updateCam();ctx.fillStyle='#000';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(-camX,-camY);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(lab[y][x]==1){ctx.fillStyle='#0a194e';ctx.fillRect(x*W,y*H,W,H);ctx.fillStyle='#1e40af';ctx.fillRect(x*W+1,y*H+1,W-2,H-2);ctx.fillStyle='#facc15';ctx.font='bold 10px Arial';let n='';if(x==25)n='1-2';else if(x==23)n='3-4';else if(x==21)n='5-6';else if(x==19)n='7-8';else if(x==17)n='9-10';else if(x==15)n='11-12';else if(x==13)n='13-14';else if(x==11)n='15-16';else if(x==9)n='17-18';else if(x==7)n='19-20';else if(x==5)n='21-22';else if(x==3)n='23-24';else if(x==1)n='25-26';ctx.fillText(n,x*W+3,y*H+16);}}ctx.fillStyle='#22c55e';ctx.fillRect(26*W,15*H,W,H);ctx.fillStyle='#000';ctx.font='bold 7px Arial';ctx.textAlign='center';ctx.fillText('ENTRADA',26*W+20,15*H+16);for(let i=0;i<rastro.length;i++){let p=rastro[i];let a=(i+1)/rastro.length;ctx.fillStyle='rgba(34,197,94,'+(0.4+a*0.6)+')';ctx.beginPath();ctx.arc(p.x*W+20,p.y*H+13,6*a+2,0,6.28);ctx.fill();}if(!(tx==26&&ty==15)){ctx.fillStyle='#ef4444';ctx.fillRect(tx*W-2,ty*H-2,W+4,H+4);}listaOrdenada.forEach((it,i)=>{if(it.visitado||i<idxRota) return;ctx.fillStyle=i==idxRota?'#facc15':'#ef4444';ctx.beginPath();ctx.arc(it.x*W+20,it.y*H+13,i==idxRota?12:9,0,6.28);ctx.fill();ctx.fillStyle=i==idxRota?'#000':'#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(i+1,it.x*W+20,it.y*H+17);});ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(px*W+20,py*H+13,11,0,6.28);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.restore();let pend=listaOrdenada.filter(l=>!l.visitado).length;document.getElementById('console').innerText=pend>0?`📍 ${idxRota+1}/${listaOrdenada.length} - ${listaOrdenada[idxRota]?.nome} [${listaOrdenada[idxRota]?.g}] - ${pend} restantes - TOTAL R$ ${calcTotal().toFixed(2).replace('.',',')} - VEL ${vel}`:'🎉 Pronto!';}
function step(){if(cam.length==0){clearInterval(tm);tm=null;let alvo=listaOrdenada[idxRota];if(alvo&&px==alvo.x&&py==alvo.y&&!alvo.visitado&&!esperando){esperando=true;mostrarModalPego(alvo);}draw();return;}let p=cam.shift();rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=p.x;py=p.y;draw();}
function mover(dx,dy){if(tm){clearInterval(tm);tm=null;}let nx=px+dx,ny=py+dy;if(!livre(nx,ny))return;rastro.push({x:px,y:py});if(rastro.length>25) rastro.shift();px=nx;py=ny;draw();}
function ir(x,y){if(tm){clearInterval(tm);tm=null;}if(x==26&&y==15) rastro=[];if(lab[y][x]==1){if(x>0&&lab[y][x-1]!=1) x--; else if(x<COLS-1&&lab[y][x+1]!=1) x++;}tx=x;ty=y;cam=achar(px,py,x,y);if(cam.length==0){px=x;py=y;draw();if(listaOrdenada[idxRota]&&px==listaOrdenada[idxRota].x&&py==listaOrdenada[idxRota].y){mostrarModalPego(listaOrdenada[idxRota]);esperando=true;}return;}tm=setInterval(step,vel);draw();}
function loop(){updateCam();draw();requestAnimationFrame(loop);}
renderT1();
window.addEventListener('resize',resize);
document.getElementById('combo').addEventListener('change',()=>{let v=document.getElementById('combo').value.split(',');ir(parseInt(v[0]),parseInt(v[1]));});
</script>
</body>
</html>
