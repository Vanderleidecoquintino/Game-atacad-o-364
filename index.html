<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V26.1 FIX MAPA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-family:Arial}
#gps{background:#052e16;color:#22c55e;padding:4px;font-size:9px;text-align:center;border-bottom:1px solid #22c55e}
#top{color:#facc15;background:#111;border-bottom:2px solid #facc15;font-size:10px;padding:5px;text-align:center;font-weight:bold}
#game{flex:1;overflow:auto;background:#222;padding:10px}
#map{display:grid;gap:1px;background:#333;border:2px solid #facc15;width:fit-content;margin:0 auto}
.cell{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:bold}
.wall{background:#1e40af;color:#6aa}
.corr{background:#000;color:#facc15;font-size:10px}
.caixa{background:#fef9c3;color:#000;font-size:5px}
.meta{background:#ef4444!important;color:#fff;animation:pisca 0.5s infinite}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:0.4}}
.player{background:#facc15!important;border-radius:50%;border:2px solid #fff;color:#000;font-size:11px;z-index:10}
#bottom{background:#000;border-top:2px solid #facc15;padding:8px}
button{height:36px;border-radius:10px;border:2px solid #facc15;font-weight:bold}
.bm{width:42px;background:#111;color:#facc15;font-size:14px}
.bmiss{width:78px;background:#a855f7;color:#fff;font-size:9px}
.bway{width:70px;background:#22c55e;color:#000;font-size:9px}
.bgps{width:58px;background:#22c55e;color:#000;font-size:9px}
</style>
</head>
<body>
<div id="gps">📍 COMENDO PONTINHOS SEM BATER - GPS REAL</div>
<div id="top">CARREGANDO MAPA...</div>
<div id="game"><div id="map"></div></div>
<div id="bottom">
<div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap">
<button class="bm" onclick="mover(-1,0)">←</button>
<button class="bm" onclick="mover(0,-1)">↑</button>
<button class="bm" onclick="mover(0,1)">↓</button>
<button class="bm" onclick="mover(1,0)">→</button>
<button class="bmiss" onclick="irPara(38,1)">🎯 TANG 364</button>
<button class="bway" onclick="irPara(2,16)">📦 WAY 1</button>
</div>
<div style="display:flex;justify-content:center;margin-top:6px">
<button class="bgps" onclick="ativarGPS()">📍 GPS</button>
</div>
</div>
<script>
const COLS=40,ROWS=19;let px=3,py=8,tx=2,ty=16,caminho=[],auto=null;
let lab=[];for(let y=0;y<ROWS;y++){lab[y]=[];for(let x=0;x<COLS;x++){if(y==18&&x>=20&&x<=33)lab[y][x]=2;else if(y==0||y==8||y==17||x==0||x==39)lab[y][x]=0;else lab[y][x]=(x%5<3)?1:0;}}
function criar(){
 const m=document.getElementById('map');m.innerHTML='';m.style.gridTemplateColumns=`repeat(${COLS},18px)`;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
  let c=document.createElement('div');c.className='cell';c.id=`c-${x}-${y}`;let v=lab[y][x];
  if(v==1){c.classList.add('wall');c.innerText=y==1?`B${Math.floor(x/5)+1}`:'';}
  else if(v==2){c.classList.add('caixa');c.innerText='0,0';}
  else{c.classList.add('corr');c.innerText='•';}
  m.appendChild(c);
 }
 let rota=achar(px,py,tx,ty);if(rota){caminho=rota;let d=document.getElementById(`c-${tx}-${ty}`);d.classList.add('meta');d.innerText='WAY1';auto=setInterval(step,180);}
 atualiza();
}
function livre(x,y){if(x<0||x>=COLS||y<0||y>=ROWS)return false;let el=document.getElementById(`c-${x}-${y}`);return el&&!el.classList.contains('wall');}
function achar(sx,sy,ex,ey){let q=[{x:sx,y:sy,p:[]}];let vis=new Set([`${sx},${sy}`]);let d=[[1,0],[-1,0],[0,1],[0,-1]];while(q.length){let c=q.shift();if(c.x==ex&&c.y==ey)return c.p;for(let[dx,dy]of d){let nx=c.x+dx,ny=c.y+dy,k=`${nx},${ny}`;if(!vis.has(k)&&livre(nx,ny)){vis.add(k);q.push({x:nx,y:ny,p:[...c.p,{x:nx,y:ny}]})}}}return null;}
