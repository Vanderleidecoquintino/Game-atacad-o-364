<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atacadão 364 - V55.4 LITE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden;touch-action:none}
#game{width:100vw;height:100vh;position:relative;background:linear-gradient(#1a2a4a,#000)}
#hud{position:absolute;top:0;left:0;width:100%;padding:10px;display:flex;justify-content:space-between;z-index:10;font-weight:bold}
#player{position:absolute;width:50px;height:50px;background:#ffcc00;border-radius:10px;left:50%;bottom:100px;transform:translateX(-50%)}
.btn{position:absolute;bottom:20px;width:70px;height:70px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:10}
#left{left:20px} #right{right:20px} #action{left:50%;transform:translateX(-50%);background:#ffcc00}
</style>
</head>
<body>
<div id="game">
<div id="hud"><span id="score">SCORE: 0</span><span>ATACADÃO 364 - LITE</span></div>
<div id="player"></div>
<div class="btn" id="left">◀</div>
<div class="btn" id="action">●</div>
<div class="btn" id="right">▶</div>
</div>
<script>
let x = window.innerWidth/2, score=0;
const player=document.getElementById('player');
let movingLeft=false, movingRight=false;
function loop(){
 if(movingLeft) x-=6;
 if(movingRight) x+=6;
 x=Math.max(25,Math.min(window.innerWidth-25,x));
 player.style.left=x+'px';
 requestAnimationFrame(loop);
}
loop();
document.getElementById('left').addEventListener('touchstart',()=>movingLeft=true);
document.getElementById('left').addEventListener('touchend',()=>movingLeft=false);
document.getElementById('right').addEventListener('touchstart',()=>movingRight=true);
document.getElementById('right').addEventListener('touchend',()=>movingRight=false);
setInterval(()=>{score++; document.getElementById('score').innerText='SCORE: '+score;},100);
</script>
</body>
</html>
