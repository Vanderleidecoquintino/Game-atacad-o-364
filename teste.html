<!DOCTYPE html>
<html>
<body style="background:#000;color:#22c55e">
<h1>TESTE 1 - SE VC TA LENDO ISSO O HTML FUNCIONA</h1>
<canvas id="c" style="width:100%;height:400px;background:#fff;border:3px solid yellow"></canvas>
<script>
let cv=document.getElementById('c');
cv.width=300; cv.height=300;
let ctx=cv.getContext('2d');
ctx.fillStyle='red';
ctx.fillRect(0,0,300,300);
ctx.fillStyle='white';
ctx.font='bold 20px Arial';
ctx.fillText('SE APARECEU QUADRADO VERMELHO, CANVAS OK',10,150);
alert('Canvas teste OK');
</script>
</body>
</html>
